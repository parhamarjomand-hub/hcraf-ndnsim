name: "HCRAF - Stage 1AM F3 Mixed RNG Load and Within-Arm Classes (v0.47.1 C++ scenario-version fix)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f3_mixed_rng_v047:
    name: "360 ns-3 runs | fixed C++ schema | no Freeze"
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 355
    steps:
      - name: Install pinned ndnSIM dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update > /tmp/hcraf_v047_apt_update.log 2>&1
          apt-get install -y --no-install-recommends git ca-certificates build-essential \
            python3 python3-dev python3-setuptools python3-pip python3-pytest \
            pkg-config libboost-all-dev libssl-dev libsqlite3-dev libpcap-dev \
            libgsl-dev libprotobuf-dev protobuf-compiler libxml2-dev libxslt1-dev \
            libevent-dev graphviz doxygen time > /tmp/hcraf_v047_apt_install.log 2>&1
      - name: Checkout private source repository
        uses: actions/checkout@v4
      - name: Verify pinned references, SHA and safe source extraction
        shell: bash
        run: |
          set -euo pipefail
          echo "f21a132299e88fdee65397b7d846c3fa47bc7ee041dd6a161e7bd48651c925da  hcraf_stage1am_f3_mixed_sources.zip" | sha256sum -c -
          echo "b4fe49f0796ca6f12b2f140931e3158c6278dc5742309ea4c3f5f79c5502b8c4  hcraf_stage1s_approved_reference.zip" | sha256sum -c -
          mkdir -p artifact/stage1s episode_output
          cp /tmp/hcraf_v047_apt_update.log episode_output/apt_update.log
          cp /tmp/hcraf_v047_apt_install.log episode_output/apt_install.log
          python3 - <<'PYCODE' 2>&1 | tee episode_output/unpack.log
          import hashlib,json,pathlib,stat,zipfile
          def unpack(name,dest,prefix=None,expected_members=None):
              with zipfile.ZipFile(name) as z:
                  assert z.testzip() is None,'ZIP_CRC_FAIL'
                  names=z.namelist()
                  assert len(names)==len(set(names)),'DUPLICATE_ZIP_MEMBER'
                  if expected_members is not None:assert len(names)==expected_members,'SOURCE_MEMBER_COUNT'
                  for n in names:
                      if n.endswith('/') or (prefix and not n.startswith(prefix)):continue
                      rel=pathlib.PurePosixPath(n)
                      assert n and not n.startswith('/') and '\\' not in n and '..' not in rel.parts,'UNSAFE_ZIP_PATH'
                      assert stat.S_IFMT(z.getinfo(n).external_attr>>16)!=stat.S_IFLNK,'SYMLINK_FORBIDDEN'
                      out=dest.joinpath(*rel.parts);out.parent.mkdir(parents=True,exist_ok=True)
                      data=z.read(n)
                      if out.exists():assert out.read_bytes()==data,'CONFLICT_EXISTING_SOURCE:'+str(out)
                      out.write_bytes(data)
                      if n.endswith('.sh'):out.chmod(0o755)
                  print('unpacked',name,len(names))
          unpack('hcraf_stage1am_f3_mixed_sources.zip',pathlib.Path('.'),expected_members=296)
          manifest=json.loads(pathlib.Path('HCRAF_STAGE1AM_V047_SOURCE_SHA256.json').read_text())
          assert manifest['schema']=='HCRAF_STAGE1AM_V047_SOURCE'
          assert len(manifest['files'])==295
          for n,h in manifest['files'].items():
              assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h,'SOURCE_HASH_MISMATCH:'+n
          unpack('hcraf_stage1s_approved_reference.zip',pathlib.Path('artifact'),prefix='stage1s/')
          print('ALL_SOURCE_HASHES_VALID',len(manifest['files']))
          PYCODE
      - name: Full legacy plus new Python contracts, C++ fixtures, shell syntax
        shell: bash
        run: |
          set -euo pipefail
          HCRAF_STAGE1S_RUN_ROOT="$PWD/artifact/stage1s" PYTHONDONTWRITEBYTECODE=1 \
            python3 -m unittest discover -s hcraf/episode/tests -p 'test_*.py' -q \
            > episode_output/python_tests.log 2>&1
          tail -8 episode_output/python_tests.log
          for driver in wire_decode_driver lp_stage1w_driver producer_receipt_nonce_driver; do
            g++ -std=c++11 -Wall -Wextra -pedantic -O2 -I hcraf/episode/src \
              "hcraf/episode/tests/${driver}.cpp" -o "/tmp/${driver}"
            "/tmp/${driver}" > "episode_output/${driver}.log" 2>&1
          done
          bash -n hcraf/episode/scripts/run_stage1am_f3_mixed.sh
          bash -n hcraf/episode/scripts/build_stage1am_f3_mixed.sh
      - name: Build native NFD/ndnSIM plus new mixed-load C++ scenario
        shell: bash
        run: |
          set -euo pipefail
          bash hcraf/episode/scripts/build_stage1am_f3_mixed.sh > episode_output/build.log 2>&1
          tail -50 episode_output/build.log
          cmp -s hcraf/episode/src/hcraf-stage1am-f3-mixed-pilot.cpp \
            episode_sources/ns-3/scratch/hcraf-stage1am-f3-mixed-pilot.cc
      - name: Run 180 matched pairs, seal I Validation before J Test
        shell: bash
        run: |
          set -euo pipefail
          bash hcraf/episode/scripts/run_stage1am_f3_mixed.sh > episode_output/run.log 2>&1
          tail -100 episode_output/run.log
      - name: Always create immutable raw evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p episode_output
          if [ -f hcraf/episode/scripts/manifest_stage1am_f3_mixed.py ];then
            python3 hcraf/episode/scripts/manifest_stage1am_f3_mixed.py "$PWD"
          else
            find episode_output -type f -print0 | sort -z | xargs -0 -r sha256sum > episode_output/fallback_hashes.txt
          fi
      - name: Always upload raw evidence on PASS or FAILURE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-stage1am-f3-mixed-${{ github.run_number }}-${{ github.run_attempt }}
          path: episode_output/
          if-no-files-found: warn
