name: "HCRAF F3 P4 Physical Bottleneck Mapping DEV ONLY (v0.52.6 P3)"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  p4-p3-physical-mapping-four-historical-fixtures-only:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 355
    env:
      V0526_SOURCE_SHA256: "bc18ad86a07036250b3ec488df90e7d1936706b56185fac0a942d4ca6bc08d63"
    steps:
      - name: Install pinned container build dependencies
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update > /tmp/v0526_apt_update.log 2>&1
          apt-get install -y --no-install-recommends git curl ca-certificates build-essential \
            python3 python3-dev python3-setuptools python3-pip python3-pytest \
            pkg-config libboost-all-dev libssl-dev libsqlite3-dev libpcap-dev \
            libgsl-dev libprotobuf-dev protobuf-compiler libxml2-dev libxslt1-dev \
            libevent-dev graphviz doxygen time > /tmp/v0526_apt_install.log 2>&1

      - name: Checkout full ancestral source history
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize failure-safe science diagnostics
        id: init
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p episode_output/v0526_preflight
          echo 'P4/P3 DEV: four historical rng22001 simulations; queue12 outside v0520; NO new P4 data, NO F3, NO training or heldout' > episode_output/v0526_preflight/START_HERE.txt

      - name: Verify four pinned GitHub run parents and exact artifact digests
        id: parents
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          python3 - <<'PY' > episode_output/v0526_preflight/PARENT_GITHUB_AUDIT.log 2>&1
          import json,os,subprocess,urllib.request
          token=os.environ['GH_TOKEN']; assert token, 'NO_GITHUB_ACTIONS_READ_TOKEN'
          repo=os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'HCRAF-P4-P3-v0526'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:
                  return json.load(r)
          parents=[
              ('43567814962','3808ddcebc4480eefbe64f0a16c69afd35f05dcd',None,None,None),
              ('44354340404','079cb06ae8cdef07abf6df3b2ff34b0607113b2a',14452244240,'hcraf-f3-queue-pressure-feasibility-v0523-run-44354340404','a987ee25118bc3de9c4b341c66e036f2c34783f3390ad7cb97666c8214aca8b2'),
              ('44378629623','059c6485957450d2ffcf7bb2b2a46656bb6088e2',14462730554,None,'9e7e5a66a39ba385f1070471a0b82ae05a51b22c9dd5298f40221e2f673f4aa6'),
              ('44455776592','4e78a88ea11f16c315704838e3db8b291237d41b',14497159457,None,'bcc4a5823f08de6a493dcfd0eb8f661f9bbfb2f8e15d6e2b91a1c7cb34dcbddd'),
          ]
          for run_id,commit,artifact_id,artifact_name,digest in parents:
              base=f'https://api.github.com/repos/{repo}/actions/runs/{run_id}'
              r=get(base)
              assert r['conclusion']=='success' and r['head_sha']==commit, 'PARENT_RUN_CHANGED:'+run_id
              subprocess.check_call(['git','merge-base','--is-ancestor',commit,'HEAD'])
              if run_id=='43567814962':
                  assert r['path'].endswith('/hcraf-stage1am-f3-future-path-queue-pressure-prereg-v0.52.0.yml')
              if run_id=='44354340404':
                  assert r['path'].endswith('/hcraf-stage1am-f3-queue-pressure-feasibility-dev-v0.52.3.yml')
              if artifact_id is not None:
                  matches=[a for page in range(1,5) for a in get(base+f'/artifacts?per_page=100&page={page}')['artifacts']
                           if a['id']==artifact_id]
                  assert len(matches)==1 and not matches[0]['expired'], 'PARENT_ARTIFACT_MISSING_OR_EXPIRED:'+run_id
                  if artifact_name:
                      assert matches[0]['name']==artifact_name, 'PARENT_ARTIFACT_NAME_CHANGED:'+run_id
                  assert matches[0].get('digest')=='sha256:'+digest, 'PARENT_ARTIFACT_DIGEST_CHANGED:'+run_id
              print('PASS_IMMUTABLE_GITHUB_PARENT',run_id,commit,artifact_id,flush=True)
          print('P4_RESERVED_SEEDS_NOT_RUN; ORIGINAL_V0520_AND_V0524_LOCKS_UNCHANGED')
          PY
          cat episode_output/v0526_preflight/PARENT_GITHUB_AUDIT.log

      - name: Download immutable v0.52.0 historical lock receipt
        id: lock
        uses: actions/download-artifact@v4
        with:
          name: hcraf-f3-future-path-queue-pressure-prereg-v0520
          run-id: "43567814962"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: episode_output/v0526_preflight/lock_artifact

      - name: Verify source SHA and parent preimages then restore code to expected directories
        id: sources
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          python3 - <<'PY' > episode_output/v0526_preflight/SOURCE_PARENT_RESTORE.log 2>&1
          import hashlib,json,os,pathlib,stat,subprocess,zipfile
          fn='hcraf_stage1am_f3_p4_physical_mapping_dev_v0526_sources.zip'
          manifest='HCRAF_F3_P4_PHYSICAL_MAPPING_V0526_SOURCE_SHA256.json'
          helper='hcraf/episode/scripts/prepare_stage1am_f3_p4_physical_mapping_v0526.py'
          blob=pathlib.Path(fn).read_bytes(); expected=os.environ['V0526_SOURCE_SHA256']
          assert hashlib.sha256(blob).hexdigest()==expected, 'NEW_SOURCE_ZIP_SHA_CHANGED'
          assert subprocess.check_output(['git','show','HEAD:'+fn])==blob, 'NEW_SOURCE_ZIP_NOT_COMMITTED'
          with zipfile.ZipFile(fn) as z:
              assert z.testzip() is None, 'NEW_ZIP_BAD_CRC'
              names=z.namelist(); assert len(names)==len(set(names)), 'DUPLICATE_ZIP_MEMBER'
              for n in names:
                  p=pathlib.PurePosixPath(n)
                  assert not n.startswith('/') and '..' not in p.parts and '\\' not in n
                  assert not stat.S_ISLNK(z.getinfo(n).external_attr>>16), 'UNSAFE_SOURCE_SYMLINK'
              m=json.loads(z.read(manifest))
              assert set(names)==set(m['files'])|{manifest}, 'NEW_ZIP_FILE_MANIFEST_MISMATCH'
              for n,digest in m['files'].items():
                  assert hashlib.sha256(z.read(n)).hexdigest()==digest, 'NEW_FILE_SHA_MISMATCH:'+n
              assert helper in m['files'], 'MISSING_RESTORE_HELPER'
              source=z.read(helper)
          # Execute only the *authenticated* in-memory helper; it performs all
          # pinned parent checks before writing any new source into directories.
          exec(compile(source,helper,'exec'),{'__name__':'__main__'})
          PY
          cat episode_output/v0526_preflight/SOURCE_PARENT_RESTORE.log

      - name: Offline causal-contract and physical-localization tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s hcraf/episode/tests -p 'test_stage1am_f3_queue_telemetry_smoke_v0522.py' -v \
            > episode_output/v0526_preflight/UNIT_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s hcraf/episode/tests -p 'test_stage1am_f3_queue_pressure_feasibility_v0523.py' -v \
            >> episode_output/v0526_preflight/UNIT_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts python3 -m unittest discover \
            -s hcraf/episode/tests -p 'test_stage1am_f3_p4_physical_mapping_v0526.py' -v \
            >> episode_output/v0526_preflight/UNIT_TESTS.log 2>&1
          python3 hcraf/episode/scripts/validate_online_queue_telemetry_v0522.py --selftest \
            --summary episode_output/v0526_preflight/TELEMETRY_SCHEMA_SELFTEST.json
          python3 hcraf/episode/scripts/run_stage1am_f3_p4_physical_mapping_v0526.py --preflight-only \
            > episode_output/v0526_preflight/FOUR_FIXTURE_PREFLIGHT.json
          echo 'Historical Stage1S tests remain DEFERRED; no false PASS claim.' \
            > episode_output/v0526_preflight/STAGE1S_DEFERRED.txt

      - name: Compile the previously reviewed P3 C++ network model unchanged
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bash hcraf/episode/scripts/build_stage1am_f3_queue_telemetry_smoke_v0522.sh \
            > episode_output/v0526_preflight/CPP_BUILD.log 2>&1
          tail -20 episode_output/v0526_preflight/CPP_BUILD.log

      - name: Run exactly four P4-P3 DEV checks on mid and relay with paired controls
        id: simulate
        shell: bash
        run: |
          set -euo pipefail
          python3 hcraf/episode/scripts/run_stage1am_f3_p4_physical_mapping_v0526.py \
            > episode_output/v0526_preflight/SIMULATIONS_AND_AUDIT.log 2>&1
          tail -55 episode_output/v0526_preflight/SIMULATIONS_AND_AUDIT.log

      - name: Preserve science locks and logs even on partial failure
        if: always()
        id: diagnose
        shell: bash
        env:
          PARENTS: ${{ steps.parents.outcome }}
          SOURCES: ${{ steps.sources.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SIMULATE: ${{ steps.simulate.outcome }}
        run: |
          set -u
          mkdir -p episode_output/v0526_preflight
          {
            echo 'P4/P3 v0.52.6; ONLY historical fixture rng22001; capacity12 outside v0520'
            echo "github_run_id=${GITHUB_RUN_ID:-unknown} git_sha=${GITHUB_SHA:-unknown}"
            echo "parents=$PARENTS sources=$SOURCES tests=$TESTS build=$BUILD simulate=$SIMULATE"
            echo 'Congestion=null FutureCongestion=null F3_ready=false GO_FREEZE=false training_ready=false heldout_release_authorized=false'
            echo 'No official F3 labels; no P4 reserved RNG; no Stage1AO; no NSGA-III'
          } > episode_output/v0526_preflight/SCIENCE_EXECUTION_GUARD.txt
          find episode_output -maxdepth 7 -type f | sort > episode_output/v0526_preflight/OUTPUT_INVENTORY.txt
          cp /tmp/v0526_apt_update.log episode_output/v0526_preflight/apt_update.log 2>/dev/null || true
          cp /tmp/v0526_apt_install.log episode_output/v0526_preflight/apt_install.log 2>/dev/null || true

      - name: Upload independent physical witnesses and all failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-f3-p4-physical-bottleneck-mapping-dev-v0526-run-${{ github.run_id }}
          path: |
            episode_output/v0526_preflight/
            episode_output/stage1am_f3_p4_physical_mapping_dev_v0526/
          if-no-files-found: error
          retention-days: 30
