name: "HCRAF F3 P12H Frozen Models Independent Validation 48 (v0.52.22)"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exactly-forty-eight-p12e-validation-only-frozen-model-before-simulation:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 355
    env:
      V0526_SOURCE_SHA256: "bc18ad86a07036250b3ec488df90e7d1936706b56185fac0a942d4ca6bc08d63"
      V05216_SOURCE_SHA256: "33b4c9d18d1f0f3cef581ce4e2b8e983295eb678d67a3939a8b4faa786fcc0b5"
      V05218_SOURCE_SHA256: "e4cf3e0b0784763746c3a690a9f716f70ecb27a5a88d9ac2a31fb798fa3992fb"
      V05219_SOURCE_SHA256: "72e46581c8124e83372fb84f5bf014637d44d1c61f990cb8d0582f04de14b96f"
      V05220_SOURCE_SHA256: "000f5d89c0490c46afdc5e4d741dcf85935e193f013dd37a4ed33299b7403082"
      V05221_SOURCE_SHA256: "21f0ac48cb825a97b8deb8bc8b2377483a1140fe9ffa2e0aaa32872e26451df2"
      V05222_SOURCE_SHA256: "351a57feec078bcadf9ba207087bb9774bee0c829aac38bacc5801ae810daddf"
    steps:
      - name: Install proven bounded-retry ndnSIM prerequisites
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          : > /tmp/p12h_apt_update.log
          : > /tmp/p12h_apt_install.log
          sed -i '/focal-backports/d' /etc/apt/sources.list
          sed -i 's#http://archive.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
          for attempt in 1 2 3; do
            if [ "$attempt" -eq 2 ]; then
              sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
              sed -i 's#http://security.ubuntu.com/ubuntu#https://security.ubuntu.com/ubuntu#g' /etc/apt/sources.list
            elif [ "$attempt" -eq 3 ]; then
              sed -i 's#https://archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
              sed -i 's#https://security.ubuntu.com/ubuntu#http://security.ubuntu.com/ubuntu#g' /etc/apt/sources.list
            fi
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 \
              -o Acquire::https::Timeout=25 update >> /tmp/p12h_apt_update.log 2>&1 || true
            if apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 \
              -o Acquire::https::Timeout=25 install -y --no-install-recommends \
              git curl ca-certificates build-essential \
              python3 python3-dev python3-setuptools python3-pip python3-pytest \
              pkg-config libboost-all-dev libssl-dev libsqlite3-dev libpcap-dev \
              libgsl-dev libprotobuf-dev protobuf-compiler libxml2-dev libxslt1-dev \
              libevent-dev graphviz doxygen time >> /tmp/p12h_apt_install.log 2>&1; then
              echo "PASS_P12H_APT_ATTEMPT=$attempt" >> /tmp/p12h_apt_install.log
              exit 0
            fi
          done
          tail -50 /tmp/p12h_apt_install.log
          exit 1

      - name: Checkout complete Git provenance history
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize prospective independent Validation-only evidence fences
        id: init
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p episode_output/v05222_preflight
          echo 'P12H: model freeze on 6 DEV seeds before all 48 VALIDATION physical cases; no HELDOUT or Stage1AO.' > episode_output/v05222_preflight/START_HERE.txt

      - name: Authenticate P12G success and Git source SHA ancestry
        id: parent
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          python3 - <<'PY' > episode_output/v05222_preflight/P12G_AUTHENTICATED_GITHUB_PARENT.log 2>&1
          import hashlib,json,os,pathlib,subprocess,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo=='parhamarjomand-hub/hcraf-ndnsim'
          token=os.environ['GH_TOKEN'];assert token
          h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
             'User-Agent':'HCRAF-P12H-v05222'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(
                  'https://api.github.com/repos/'+repo+path,headers=h),timeout=60) as r:
                  return json.load(r)
          run=get('/actions/runs/44779320010')
          commit='9689fa0e1c5dc80a990451a282cf78f1b0e71c6c'
          assert run['id']==44779320010 and run['status']=='completed'
          assert run['conclusion']=='success' and run['head_sha']==commit
          assert run['path'].endswith('/hcraf-stage1am-f3-p12g-development-seedblocked-ap-v0.52.21.yml')
          subprocess.check_call(['git','merge-base','--is-ancestor',commit,'HEAD'])
          artifact=get('/actions/artifacts/14652215437')
          assert artifact['name']=='hcraf-f3-p12g-dev-seedblocked-ap-v05221-run-44779320010'
          assert artifact['digest']=='sha256:1792fce65047c4594f8fd8691cd8480842edfaae0a2b38bb5cf75226b5919718'
          assert not artifact['expired'] and artifact.get('workflow_run',{}).get('id')==44779320010
          for filename,env in (
              ('hcraf_stage1am_f3_p12_development_v05220_sources.zip','V05220_SOURCE_SHA256'),
              ('hcraf_stage1am_f3_p12e_independent_prereg_v05219_sources.zip','V05219_SOURCE_SHA256'),
              ('hcraf_stage1am_f3_p12g_seedblocked_dev_v05221_sources.zip','V05221_SOURCE_SHA256'),
              ('hcraf_stage1am_f3_p12h_validation_v05222_sources.zip','V05222_SOURCE_SHA256')):
              blob=pathlib.Path(filename).read_bytes()
              assert hashlib.sha256(blob).hexdigest()==os.environ[env],filename+' SHA'
              assert subprocess.check_output(['git','show','HEAD:'+filename])==blob,filename+' GIT'
          print('PASS_P12H_PINNED_P12G_RUN_ARTIFACT_SHA_GIT_ANCESTRY_ALL_SOURCE_PREIMAGES')
          PY
          cat episode_output/v05222_preflight/P12G_AUTHENTICATED_GITHUB_PARENT.log

      - name: Retrieve original unchanged v0.52.0 preregistration receipt
        id: receipt
        uses: actions/download-artifact@v4
        with:
          name: hcraf-f3-future-path-queue-pressure-prereg-v0520
          run-id: "43567814962"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: episode_output/v0526_preflight/lock_artifact

      - name: Verify every parent and current SHA then restore immutable sources
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > episode_output/v05222_preflight/P12H_ALL_PARENT_AND_SOURCE_SHA.log 2>&1
          import hashlib,io,json,os,pathlib,stat,subprocess,zipfile
          name='hcraf_stage1am_f3_p12h_validation_v05222_sources.zip'
          manifest='HCRAF_F3_P12H_VALIDATION_V05222_SOURCE_SHA256.json'
          helper='hcraf/episode/scripts/prepare_stage1am_f3_p12h_validation_v05222.py'
          raw=pathlib.Path(name).read_bytes()
          sha=lambda d:hashlib.sha256(d).hexdigest()
          assert sha(raw)==os.environ['V05222_SOURCE_SHA256']
          assert subprocess.check_output(['git','show','HEAD:'+name])==raw
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert len(names)==len(set(names))
              m=json.loads(z.read(manifest))
              assert set(names)==set(m['files'])|{manifest}
              for n,digest in m['files'].items():
                  p=pathlib.PurePosixPath(n)
                  assert n.startswith('hcraf/episode/') and '..' not in p.parts
                  assert not n.startswith('/') and '\\' not in n
                  assert not stat.S_ISLNK(z.getinfo(n).external_attr>>16)
                  assert sha(z.read(n))==digest,n
              assert helper in m['files']
              source=z.read(helper)
          exec(compile(source,helper,'exec'),{'__name__':'__main__'})
          PY
          tail -25 episode_output/v05222_preflight/P12H_ALL_PARENT_AND_SOURCE_SHA.log

      - name: Test historical P12F and P12G plus new P12H partition and model-freeze fences
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          for pattern in \
            'test_stage1am_f3_p12_randomized_pilot_v05215.py' \
            'test_stage1am_f3_p12_pilot_v05216.py' \
            'test_stage1am_f3_p12_tail_probe_v05217.py' \
            'test_stage1am_f3_p12_tailprobe_v05218.py' \
            'test_stage1am_f3_p12e_independent_prereg_v05219.py' \
            'test_stage1am_f3_p12_development_v05220.py' \
            'test_stage1am_f3_p12g_seedblocked_dev_v05221.py' \
            'test_stage1am_f3_p12h_validation_v05222.py'; do
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts \
              python3 -m unittest discover -s hcraf/episode/tests -p "$pattern" -v \
              >> episode_output/v05222_preflight/P12H_ALL_SCIENCE_FENCE_TESTS.log 2>&1
          done
          PYTHONDONTWRITEBYTECODE=1 python3 \
            hcraf/episode/scripts/run_stage1am_f3_p12h_validation_v05222.py --preflight-only \
            > episode_output/v05222_preflight/P12H_PRE_REGISTERED_48_ZERO_SIM_PREFLIGHT.json
          tail -20 episode_output/v05222_preflight/P12H_ALL_SCIENCE_FENCE_TESTS.log

      - name: Download exactly authenticated P12G Development-only model provenance
        id: download_dev
        uses: actions/download-artifact@v4
        with:
          name: hcraf-f3-p12g-dev-seedblocked-ap-v05221-run-44779320010
          run-id: "44779320010"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: p12h_input_p12g

      - name: SHA-freeze both full six-seed Development models BEFORE any Validation simulation
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 \
            hcraf/episode/scripts/freeze_stage1am_f3_p12h_models_v05222.py \
            > episode_output/v05222_preflight/P12H_MODEL_FROZEN_BEFORE_VALIDATION.log 2>&1
          cat episode_output/v05222_preflight/P12H_MODEL_FROZEN_BEFORE_VALIDATION.log

      - name: Build isolated P12H Validation-only C++ binary on proven ndnSIM
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bash hcraf/episode/scripts/build_stage1am_f3_p12_validation_v05222.sh \
            > episode_output/v05222_preflight/P12H_CPP_BUILD.log 2>&1
          tail -25 episode_output/v05222_preflight/P12H_CPP_BUILD.log

      - name: Execute all 48 Validation physical cases once then score frozen models
        id: simulate
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 \
            hcraf/episode/scripts/run_stage1am_f3_p12h_validation_v05222.py \
            > episode_output/v05222_preflight/P12H_VALIDATION_48_AND_ONCE_ONLY_PR_AUC.log 2>&1
          tail -30 episode_output/v05222_preflight/P12H_VALIDATION_48_AND_ONCE_ONLY_PR_AUC.log

      - name: Always preserve science fences including technical failure status
        if: always()
        shell: bash
        env:
          PARENT: ${{ steps.parent.outcome }}
          RESTORE: ${{ steps.restore.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          DEV_DOWNLOAD: ${{ steps.download_dev.outcome }}
          FREEZE: ${{ steps.freeze.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SIMULATE: ${{ steps.simulate.outcome }}
        run: |
          set -u
          mkdir -p episode_output/v05222_preflight
          {
            echo "P12H run=${GITHUB_RUN_ID:-unknown} commit=${GITHUB_SHA:-unknown}"
            echo "parent=$PARENT restore=$RESTORE tests=$TESTS dev_download=$DEV_DOWNLOAD freeze=$FREEZE build=$BUILD simulate=$SIMULATE"
            echo 'Model SHA must exist before first Validation simulation; 48 Validation, 0 Heldout, 0 model refits on Validation'
            echo 'Development only before model freeze; 4 independent Validation seeds evaluated once'
            echo 'Congestion=null FutureCongestion=null F3_ready=false GO_FREEZE=false training_ready=false heldout_release_authorized=false'
            echo 'Stage 1AO and NSGA-III forbidden'
          } > episode_output/v05222_preflight/SCIENCE_LOCKS_AND_STEP_OUTCOMES.txt
          cp /tmp/p12h_apt_update.log episode_output/v05222_preflight/apt_update.log 2>/dev/null || true
          cp /tmp/p12h_apt_install.log episode_output/v05222_preflight/apt_install.log 2>/dev/null || true

      - name: Always upload model-freeze receipt and four SHA-audited raw Validation seed ZIPs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-f3-p12h-independent-validation-v05222-run-${{ github.run_id }}
          path: |
            episode_output/v05222_preflight/
            episode_output/stage1am_f3_p12h_validation_v05222/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Recover transient validation witnesses on unexpected technical failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-f3-p12h-v05222-temporary-failure-evidence-${{ github.run_id }}
          path: episode_output/v05222_temporary_raw_validation_seed_work/
          if-no-files-found: ignore
          retention-days: 30
