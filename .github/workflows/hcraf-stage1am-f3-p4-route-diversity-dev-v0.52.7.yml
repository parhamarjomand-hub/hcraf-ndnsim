name: "HCRAF F3 P4 Route Diversity DEV ONLY (v0.52.7 P4)"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-two-unseen-selected-slots-eight-dev-fixtures:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 355
    env:
      V0526_SOURCE_SHA256: "bc18ad86a07036250b3ec488df90e7d1936706b56185fac0a942d4ca6bc08d63"
      V0527_SOURCE_SHA256: "ed810ed57656c1d977a100f34f727a38acc2d8c9ce01fad753bf4c9d4875abdc"
    steps:
      - name: Install same ns3 ndnSIM build dependencies as successful P4P3
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update > /tmp/p4p4_apt_update.log 2>&1
          apt-get install -y --no-install-recommends git curl ca-certificates build-essential \
            python3 python3-dev python3-setuptools python3-pip python3-pytest \
            pkg-config libboost-all-dev libssl-dev libsqlite3-dev libpcap-dev \
            libgsl-dev libprotobuf-dev protobuf-compiler libxml2-dev libxslt1-dev \
            libevent-dev graphviz doxygen time > /tmp/p4p4_apt_install.log 2>&1

      - name: Checkout complete ancestry
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize safe diagnostics and scientific fence
        id: init
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p episode_output/v0527_preflight
          echo 'DEV route diversity slots1/2 only; eight historical 22002/22003 fixtures; NOT official calibration, NO independent P4 seeds' > episode_output/v0527_preflight/START_HERE.txt

      - name: Verify P4P3 GitHub parent commit and exact immutable artifact
        id: parent
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          python3 - <<'PY' > episode_output/v0527_preflight/GITHUB_PARENT_PROVENANCE.log 2>&1
          import json,os,subprocess,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; tok=os.environ['GH_TOKEN']; assert tok
          h={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','User-Agent':'HCRAF-P4P4-v0527'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=60) as r:
                  return json.load(r)
          base=f'https://api.github.com/repos/{repo}/actions/runs/44458755203'
          run=get(base)
          sha='56a012fc4dee861b23e89ef0812c4a193df08ae7'
          assert run['conclusion']=='success' and run['head_sha']==sha, 'P4P3_PARENT_NOT_THE_VERIFIED_RUN'
          assert run['path'].endswith('/hcraf-stage1am-f3-p4-physical-bottleneck-mapping-dev-v0.52.6.yml'), 'WRONG_P4P3_WORKFLOW'
          subprocess.check_call(['git','merge-base','--is-ancestor',sha,'HEAD'])
          artifact=get(f'https://api.github.com/repos/{repo}/actions/artifacts/14500772826')
          assert artifact['name']=='hcraf-f3-p4-physical-bottleneck-mapping-dev-v0526-run-44458755203'
          assert not artifact['expired'] and artifact['digest']=='sha256:7d79b2dd488ea98cac56f0ab14ed33882107e57dec17702b07f5e2b02976efc1'
          assert artifact.get('workflow_run',{}).get('id')==44458755203
          print('PASS_PINNED_P4P3_PARENT_GITHUB_RUN_AND_ARTIFACT')
          print('This is historical-fixture path verification, not authorization for P4 144-run execution.')
          PY
          cat episode_output/v0527_preflight/GITHUB_PARENT_PROVENANCE.log

      - name: Retrieve v0.52.0 locked historical plan receipt
        id: receipt
        uses: actions/download-artifact@v4
        with:
          name: hcraf-f3-future-path-queue-pressure-prereg-v0520
          run-id: "43567814962"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: episode_output/v0526_preflight/lock_artifact

      - name: Verify whole source-zip ancestry and restore unchanged physical C++
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > episode_output/v0527_preflight/SOURCE_RESTORE_AND_HASH_GATES.log 2>&1
          import hashlib,io,json,os,pathlib,stat,subprocess,zipfile
          old='hcraf_stage1am_f3_p4_physical_mapping_dev_v0526_sources.zip'
          new='hcraf_stage1am_f3_p4_route_diversity_dev_v0527_sources.zip'
          helper='hcraf/episode/scripts/prepare_stage1am_f3_p4_physical_mapping_v0526.py'
          old_m='HCRAF_F3_P4_PHYSICAL_MAPPING_V0526_SOURCE_SHA256.json'
          new_m='HCRAF_F3_P4_ROUTE_DIVERSITY_V0527_SOURCE_SHA256.json'
          def checked_committed(name,expected):
              raw=pathlib.Path(name).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==expected, 'ROOT_ZIP_SHA_CHANGED:'+name
              assert subprocess.check_output(['git','show','HEAD:'+name])==raw, 'SOURCE_ZIP_NOT_COMMITTED:'+name
              return raw
          def checked_archive(raw,manifest):
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  assert z.testzip() is None, 'BAD_ZIP_CRC'
                  names=z.namelist()
                  assert len(names)==len(set(names)), 'DUPLICATE_ARCHIVE_ENTRY'
                  for name in names:
                      path=pathlib.PurePosixPath(name)
                      assert name and not name.startswith('/') and '..' not in path.parts and '\\' not in name
                      assert not stat.S_ISLNK(z.getinfo(name).external_attr>>16)
                  info=json.loads(z.read(manifest))
                  assert set(names)==set(info['files'])|{manifest}, 'ZIP_MANIFEST_MEMBER_MISMATCH'
                  for name,digest in info['files'].items():
                      assert hashlib.sha256(z.read(name)).hexdigest()==digest, 'FILE_SHA_CHANGED:'+name
                  files={n:z.read(n) for n in info['files']}
              return info,files
          old_raw=checked_committed(old,os.environ['V0526_SOURCE_SHA256'])
          old_info,old_files=checked_archive(old_raw,old_m)
          assert helper in old_files
          exec(compile(old_files[helper],helper,'exec'),{'__name__':'__main__'})
          new_raw=checked_committed(new,os.environ['V0527_SOURCE_SHA256'])
          m,files=checked_archive(new_raw,new_m)
          assert m['stage']=='v0.52.7_P4_P4_DEV_ROUTE_DIVERSITY_HISTORICAL_FIXTURES_ONLY'
          assert m['parent_p4_p3_run_id']=='44458755203'
          assert m['simulations_planned']==8 and m['independent_P4_seeds_consumed']==0
          assert m['original_v0520_prereg_unchanged'] and m['original_v0524_prereg_unchanged']
          for k,v in {'Congestion':None,'FutureCongestion':None,'F3_ready':False,'GO_FREEZE':False,
                      'training_ready':False,'heldout_release_authorized':False}.items():
              assert m[k] is v, 'NEW_MANIFEST_SCIENCE_LOCK_BROKEN:'+k
          assert all(not pathlib.Path(n).exists() for n in files), 'REFUSE_OVERWRITE_V0527_EXISTING_SOURCE'
          for n,data in files.items():
              path=pathlib.Path(n)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          print('PASS_P4P4_ALL_PARENT_PREIMAGES_NEW_ZIP_FILE_HASHES_AND_NO_OVERWRITES')
          PY
          cat episode_output/v0527_preflight/SOURCE_RESTORE_AND_HASH_GATES.log

      - name: Run offline source, selection, no-leak and negative-control tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts python3 -m unittest discover \
            -s hcraf/episode/tests -p 'test_stage1am_f3_queue_telemetry_smoke_v0522.py' -v \
            > episode_output/v0527_preflight/UNIT_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts python3 -m unittest discover \
            -s hcraf/episode/tests -p 'test_stage1am_f3_queue_pressure_feasibility_v0523.py' -v \
            >> episode_output/v0527_preflight/UNIT_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts python3 -m unittest discover \
            -s hcraf/episode/tests -p 'test_stage1am_f3_p4_physical_mapping_v0526.py' -v \
            >> episode_output/v0527_preflight/UNIT_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts python3 -m unittest discover \
            -s hcraf/episode/tests -p 'test_stage1am_f3_p4_route_diversity_dev_v0527.py' -v \
            >> episode_output/v0527_preflight/UNIT_TESTS.log 2>&1
          python3 hcraf/episode/scripts/run_stage1am_f3_p4_route_diversity_dev_v0527.py \
            --preflight-only > episode_output/v0527_preflight/EIGHT_RUN_PLAN.json

      - name: Build unchanged last-verified P3 ndnSIM C++ model
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bash hcraf/episode/scripts/build_stage1am_f3_queue_telemetry_smoke_v0522.sh \
            > episode_output/v0527_preflight/CPP_BUILD.log 2>&1
          tail -12 episode_output/v0527_preflight/CPP_BUILD.log

      - name: Run eight technical physical route diversity simulations
        id: simulate
        shell: bash
        run: |
          set -euo pipefail
          python3 hcraf/episode/scripts/run_stage1am_f3_p4_route_diversity_dev_v0527.py \
            > episode_output/v0527_preflight/EIGHT_SIMULATIONS_AND_INDEPENDENT_AUDITS.log 2>&1
          tail -55 episode_output/v0527_preflight/EIGHT_SIMULATIONS_AND_INDEPENDENT_AUDITS.log

      - name: Always save science lock status and failure diagnostics
        if: always()
        id: diagnose
        shell: bash
        env:
          PARENT: ${{ steps.parent.outcome }}
          RESTORE: ${{ steps.restore.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SIMULATE: ${{ steps.simulate.outcome }}
        run: |
          set -u
          mkdir -p episode_output/v0527_preflight
          {
            echo 'v0.52.7 P4/P4, eight engineering fixtures, rng22002/22003, selected slots 1/2 only'
            echo "run_id=${GITHUB_RUN_ID:-unknown} head_sha=${GITHUB_SHA:-unknown}"
            echo "parent=$PARENT restore=$RESTORE tests=$TESTS build=$BUILD simulate=$SIMULATE"
            echo 'Congestion=null FutureCongestion=null F3_ready=false GO_FREEZE=false training_ready=false heldout_release_authorized=false'
            echo 'No P4 new seeds, no F3 labels, no model, no Validation/Test, no Stage1AO/NSGA-III'
          } > episode_output/v0527_preflight/SCIENCE_LOCKS_AND_STEP_OUTCOMES.txt
          find episode_output -maxdepth 8 -type f | sort > episode_output/v0527_preflight/OUTPUT_INVENTORY.txt
          cp /tmp/p4p4_apt_update.log episode_output/v0527_preflight/apt_update.log 2>/dev/null || true
          cp /tmp/p4p4_apt_install.log episode_output/v0527_preflight/apt_install.log 2>/dev/null || true

      - name: Always upload independently checkable physical witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-f3-p4-route-diversity-dev-v0527-run-${{ github.run_id }}
          path: |
            episode_output/v0527_preflight/
            episode_output/stage1am_f3_p4_route_diversity_dev_v0527/
          if-no-files-found: error
          retention-days: 30
