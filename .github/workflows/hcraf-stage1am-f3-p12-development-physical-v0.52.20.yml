name: "HCRAF F3 P12F Independent Development Physical 72 (v0.52.20)"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  execute-exactly-p12e-frozen-seventy-two-development-cases-no-heldout:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 355
    env:
      V0526_SOURCE_SHA256: "bc18ad86a07036250b3ec488df90e7d1936706b56185fac0a942d4ca6bc08d63"
      V05216_SOURCE_SHA256: "33b4c9d18d1f0f3cef581ce4e2b8e983295eb678d67a3939a8b4faa786fcc0b5"
      V05218_SOURCE_SHA256: "e4cf3e0b0784763746c3a690a9f716f70ecb27a5a88d9ac2a31fb798fa3992fb"
      V05219_SOURCE_SHA256: "72e46581c8124e83372fb84f5bf014637d44d1c61f990cb8d0582f04de14b96f"
      V05220_SOURCE_SHA256: "000f5d89c0490c46afdc5e4d741dcf85935e193f013dd37a4ed33299b7403082"
    steps:
      - name: Install pinned ndnSIM dependencies with bounded retry and cache
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          : > /tmp/p12f_apt_update.log
          : > /tmp/p12f_apt_install.log
          sed -i '/focal-backports/d' /etc/apt/sources.list
          sed -i 's#http://archive.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
          for attempt in 1 2 3; do
            if [ "$attempt" -eq 2 ]; then
              sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
              sed -i 's#http://security.ubuntu.com/ubuntu#https://security.ubuntu.com/ubuntu#g' /etc/apt/sources.list
            elif [ "$attempt" -eq 3 ]; then
              sed -i 's#https://archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
              sed -i 's#https://security.ubuntu.com/ubuntu#http://security.ubuntu.com/ubuntu#g' /etc/apt/sources.list
            fi
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 \
              -o Acquire::https::Timeout=25 update >> /tmp/p12f_apt_update.log 2>&1 || true
            if apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 \
              -o Acquire::https::Timeout=25 install -y --no-install-recommends \
              git curl ca-certificates build-essential \
              python3 python3-dev python3-setuptools python3-pip python3-pytest \
              pkg-config libboost-all-dev libssl-dev libsqlite3-dev libpcap-dev \
              libgsl-dev libprotobuf-dev protobuf-compiler libxml2-dev libxslt1-dev \
              libevent-dev graphviz doxygen time >> /tmp/p12f_apt_install.log 2>&1; then
              echo "PASS_P12F_APT_ATTEMPT=$attempt" >> /tmp/p12f_apt_install.log
              exit 0
            fi
          done
          tail -50 /tmp/p12f_apt_install.log
          exit 1

      - name: Checkout complete Git history
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize exactly 72 frozen P12F development physical diagnostics
        id: init
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p episode_output/v05220_preflight
          echo 'P12F: exactly 72 DEVELOPMENT physical cases; P12E 84 SHA-locked schedules; 96 Validation/Heldout protected; no model or official F3 labels.' > episode_output/v05220_preflight/START_HERE.txt

      - name: Authenticate P12E successful prospective preregistration parent run
        id: parent
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          python3 - <<'PY' > episode_output/v05220_preflight/P12E_PINNED_GITHUB_PARENT.log 2>&1
          import json,os,subprocess,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];assert repo=='parhamarjomand-hub/hcraf-ndnsim'
          token=os.environ['GH_TOKEN'];assert token
          h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
             'User-Agent':'HCRAF-P12F-v05220'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(
                  'https://api.github.com/repos/'+repo+path,headers=h),timeout=60) as r:
                  return json.load(r)
          run=get('/actions/runs/44745133377')
          commit='5bb830a438d229024b5a1732631dff37d59b858e'
          assert run['id']==44745133377 and run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==commit
          assert run['path'].endswith('/hcraf-stage1am-f3-p12e-independent-prereg-v0.52.19.yml')
          subprocess.check_call(['git','merge-base','--is-ancestor',commit,'HEAD'])
          artifact=get('/actions/artifacts/14631664275')
          assert artifact['name']=='hcraf-f3-p12e-independent-prereg-v05219-run-44745133377'
          assert artifact['digest']=='sha256:5d94717daf2615559c0ad05ee7698c2bac8c2ecb012b76cd951c8ea7fde1d418'
          assert not artifact['expired'] and artifact.get('workflow_run',{}).get('id')==44745133377
          from pathlib import Path
          import hashlib
          name='hcraf_stage1am_f3_p12e_independent_prereg_v05219_sources.zip'
          z=Path(name).read_bytes()
          assert hashlib.sha256(z).hexdigest()=='72e46581c8124e83372fb84f5bf014637d44d1c61f990cb8d0582f04de14b96f'
          assert subprocess.check_output(['git','show','HEAD:'+name])==z
          print('PASS_P12E_SUCCESS_44745133377_COMMIT_ARTIFACT_SOURCE_SHA_GIT_ANCESTRY')
          PY
          cat episode_output/v05220_preflight/P12E_PINNED_GITHUB_PARENT.log

      - name: Retrieve unchanged v0.52.0 original preregistration receipt
        id: receipt
        uses: actions/download-artifact@v4
        with:
          name: hcraf-f3-future-path-queue-pressure-prereg-v0520
          run-id: "43567814962"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: episode_output/v0526_preflight/lock_artifact

      - name: SHA bootstrap P12A through P12E parents and frozen P12F executor
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > episode_output/v05220_preflight/ALL_PINNED_SOURCES_AND_SHA.log 2>&1
          import hashlib,io,json,os,pathlib,stat,subprocess,zipfile
          name='hcraf_stage1am_f3_p12_development_v05220_sources.zip'
          manifest='HCRAF_F3_P12F_DEVELOPMENT_EXECUTOR_V05220_SOURCE_SHA256.json'
          helper='hcraf/episode/scripts/prepare_stage1am_f3_p12_development_v05220.py'
          raw=pathlib.Path(name).read_bytes()
          sha=lambda d:hashlib.sha256(d).hexdigest()
          assert sha(raw)==os.environ['V05220_SOURCE_SHA256'],'CURRENT_ZIP_SHA_CHANGED'
          assert subprocess.check_output(['git','show','HEAD:'+name])==raw,'CURRENT_ZIP_NOT_GIT_COMMITTED'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None,'CURRENT_ZIP_BAD_CRC'
              names=z.namelist()
              assert len(names)==len(set(names)),'DUPLICATE_CURRENT_SOURCE_MEMBER'
              m=json.loads(z.read(manifest))
              assert set(names)==set(m['files'])|{manifest},'CURRENT_SOURCE_MANIFEST_MISMATCH'
              for n,digest in m['files'].items():
                  p=pathlib.PurePosixPath(n)
                  assert n.startswith('hcraf/episode/') and '..' not in p.parts and '\\' not in n
                  assert not stat.S_ISLNK(z.getinfo(n).external_attr>>16)
                  assert sha(z.read(n))==digest,'CURRENT_SOURCE_FILE_SHA:'+n
              assert helper in m['files'],'MISSING_AUTHENTICATED_RESTORE_HELPER'
              source=z.read(helper)
          exec(compile(source,helper,'exec'),{'__name__':'__main__'})
          PY
          tail -35 episode_output/v05220_preflight/ALL_PINNED_SOURCES_AND_SHA.log

      - name: Test P12A P12B P12C P12D P12E and P12F parent and leakage gates
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts \
            python3 -m unittest discover -s hcraf/episode/tests \
            -p 'test_stage1am_f3_p12_randomized_pilot_v05215.py' -v \
            > episode_output/v05220_preflight/ALL_P12_SCIENCE_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts \
            python3 -m unittest discover -s hcraf/episode/tests \
            -p 'test_stage1am_f3_p12_pilot_v05216.py' -v \
            >> episode_output/v05220_preflight/ALL_P12_SCIENCE_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts \
            python3 -m unittest discover -s hcraf/episode/tests \
            -p 'test_stage1am_f3_p12_tail_probe_v05217.py' -v \
            >> episode_output/v05220_preflight/ALL_P12_SCIENCE_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts \
            python3 -m unittest discover -s hcraf/episode/tests \
            -p 'test_stage1am_f3_p12_tailprobe_v05218.py' -v \
            >> episode_output/v05220_preflight/ALL_P12_SCIENCE_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts \
            python3 -m unittest discover -s hcraf/episode/tests \
            -p 'test_stage1am_f3_p12e_independent_prereg_v05219.py' -v \
            >> episode_output/v05220_preflight/ALL_P12_SCIENCE_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts \
            python3 -m unittest discover -s hcraf/episode/tests \
            -p 'test_stage1am_f3_p12_development_v05220.py' -v \
            >> episode_output/v05220_preflight/ALL_P12_SCIENCE_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts \
            python3 hcraf/episode/scripts/run_stage1am_f3_p12_development_v05220.py --preflight-only \
            > episode_output/v05220_preflight/P12F_72_CASE_ZERO_SIM_PRECHECK.json
          tail -23 episode_output/v05220_preflight/ALL_P12_SCIENCE_TESTS.log

      - name: Build isolated v0.52.20 P12F six-seed development C++ on proven ndnSIM
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bash hcraf/episode/scripts/build_stage1am_f3_p12_development_v05220.sh \
            > episode_output/v05220_preflight/CPP_BUILD.log 2>&1
          tail -20 episode_output/v05220_preflight/CPP_BUILD.log

      - name: Execute exactly 72 P12E Development cases then gate after six seeds
        id: simulate
        shell: bash
        run: |
          set -euo pipefail
          python3 hcraf/episode/scripts/run_stage1am_f3_p12_development_v05220.py \
            > episode_output/v05220_preflight/P12F_DEVELOPMENT_PHYSICAL_AND_SCIENCE_GATES.log 2>&1
          tail -35 episode_output/v05220_preflight/P12F_DEVELOPMENT_PHYSICAL_AND_SCIENCE_GATES.log

      - name: Always save scientific fences and physical failure diagnostics
        if: always()
        id: diagnose
        shell: bash
        env:
          PARENT: ${{ steps.parent.outcome }}
          RESTORE: ${{ steps.restore.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SIMULATE: ${{ steps.simulate.outcome }}
        run: |
          set -u
          mkdir -p episode_output/v05220_preflight
          {
            echo "P12F run=${GITHUB_RUN_ID:-unknown} commit=${GITHUB_SHA:-unknown}"
            echo "parent=$PARENT restore=$RESTORE tests=$TESTS build=$BUILD simulate=$SIMULATE"
            echo 'Exactly 72 Development physical cases P12E seeds 24501..24506; 0 Validation/Heldout simulations'
            echo 'Scientific QC PASS/NO_GO is recorded after all six seeds, never silently converted to F3 readiness'
            echo '0 official F3 labels, 0 model fits, 0 official PR-AUC'
            echo 'Congestion=null FutureCongestion=null F3_ready=false GO_FREEZE=false training_ready=false heldout_release_authorized=false'
            echo 'Stage 1AO and NSGA-III forbidden'
          } > episode_output/v05220_preflight/SCIENCE_LOCKS_AND_STEP_OUTCOMES.txt
          find episode_output/v05220_preflight episode_output/stage1am_f3_p12_development_v05220 \
            -maxdepth 2 -type f 2>/dev/null | sort \
            > episode_output/v05220_preflight/OUTPUT_INVENTORY.txt || true
          cp /tmp/p12f_apt_update.log episode_output/v05220_preflight/apt_update.log 2>/dev/null || true
          cp /tmp/p12f_apt_install.log episode_output/v05220_preflight/apt_install.log 2>/dev/null || true

      - name: Always upload six SHA-verified P12F raw seed ZIPs and separate diagnostic tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-f3-p12f-development-physical-v05220-run-${{ github.run_id }}
          path: |
            episode_output/v05220_preflight/
            episode_output/stage1am_f3_p12_development_v05220/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Save unarchived temporary raw witnesses if an unexpected technical failure occurs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-f3-p12f-v05220-temporary-failure-evidence-${{ github.run_id }}
          path: episode_output/v05220_temporary_raw_seed_work/
          if-no-files-found: ignore
          compression-level: 6
          retention-days: 30
