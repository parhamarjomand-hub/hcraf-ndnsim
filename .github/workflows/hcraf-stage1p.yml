name: HCRAF - Stage 1P Queue Visibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-visibility:
    name: Build pinned ndnSIM and audit bidirectional queue telemetry
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          set -euo pipefail
          mkdir -p episode_output
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential python3 python3-setuptools \
            python-is-python3 pkg-config libboost-all-dev libssl-dev \
            libsqlite3-dev castxml
      - name: Verify and unpack Stage1P source bundle
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib
          from pathlib import Path, PurePosixPath
          import zipfile
          archive = Path('hcraf_stage1p_sources.zip')
          expected = '690dce2d2b44c3bdfd29b7a581ca7455e6fefaeaf583b28137ad040e90944bc8'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Stage1P source bundle hash mismatch.')
          with zipfile.ZipFile(archive) as source:
              for name in source.namelist():
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts or path.parts[:2] != ('hcraf', 'episode'):
                      raise SystemExit('Unsafe source bundle path: '+name)
                  target = Path(name)
                  if target.exists():
                      raise SystemExit('Refusing to overwrite existing file: '+name)
              source.extractall('.')
          PYCODE
          cp hcraf_stage1p_sources.zip episode_output/source_bundle.zip
      - name: Test recorder and Stage1P observation software
        run: |
          set -euo pipefail
          python3 -m unittest discover -s hcraf/episode/tests -v 2>&1 | tee episode_output/unit_tests.log
      - name: Fetch pinned sources, instrument and compile
        run: |
          set -euo pipefail
          bash hcraf/episode/scripts/build.sh 2>&1 | tee episode_output/build.log
      - name: Run Stage1P directional load profiles and audit
        run: |
          set -euo pipefail
          bash hcraf/episode/scripts/run_stage1p.sh 2>&1 | tee episode_output/run.log
      - name: Record source and artifact hashes even on failure
        if: always()
        run: python3 hcraf/episode/scripts/manifest.py "$GITHUB_WORKSPACE"
      - name: Upload all logs, raw traces, diagnostics and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-stage1p-${{ github.run_number }}-${{ github.run_attempt }}
          path: episode_output/
          if-no-files-found: error
          retention-days: 14
