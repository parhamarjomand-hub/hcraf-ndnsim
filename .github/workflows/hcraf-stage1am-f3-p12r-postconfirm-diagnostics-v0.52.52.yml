name: HCRAF F3 P12R Post-Confirmation Exploratory Diagnostics (v0.52.52)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hcraf-f3-p12r-postconfirm-diagnostics-v05252
  cancel-in-progress: false
jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      ANALYSIS_SHA: "39aeb581a3db73218e8c1188ff91425ab3f21c87a07c79961569a289e8b4cff7"
      SOURCE_SHA: "1c1c6c853d0fcddc389fc8914356c5735ec44bfea110d887f969345e50f25fbc"
      QC_SHA: "5ec1fae15e3406214bac508dfb295d9e3db7310e713a0e48038f98cb16f151c4"
      FREEZE_SHA: "c68ed8da0f82229b04d5c20623142c2f46f355cb88e7aa129ba9171f24819f9c"
      PREREG_SHA: "dbb12863ca83c26b687b243211aaf698986b8d6f2f7b8656cffb06278751ae30"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install fixed numeric analysis dependency (no training library)
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5
          python -c 'import sys,numpy; assert sys.version.split()[0]=="3.13.5" and numpy.__version__=="2.3.5"'
      - name: Authenticate immutable source, frozen-model and full-confirmation ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics_preflight
          python - <<'PYCODE'
          import hashlib,json,os,pathlib,stat,subprocess,urllib.request,zipfile,datetime
          def need(ok,msg):
              if not ok: raise RuntimeError(msg)
          repo=os.environ['GITHUB_REPOSITORY'];need(repo=='parhamarjomand-hub/hcraf-ndnsim','REPO')
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'HCRAF-P12R-DIAGNOSTICS-v05252'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          parents=[(45991786037,'2adb3881a9968fe762233f966560cc80ec606aae','hcraf-stage1am-f3-p12r-dev-model-freeze-v0.52.48.yml',15193723927,'FREEZE_SHA',6083),(45995680622,'cc0b8dba61dc2d19192d5d0795d0fdfe086ff1b9','hcraf-stage1am-f3-p12r-confirm-collection-v0.52.49.yml',None,None,None),(46018414609,'a7f309e34366cd75d88595c26d756854f5b2109e','hcraf-stage1am-f3-p12r-confirm-dataset-qc-v0.52.50.yml',15207816038,'QC_SHA',1052034),(46039800832,'fbfb632adb34ab73f0d4743e6faab9aafa5a3b82','hcraf-stage1am-f3-p12r-confirm-analysis-v0.52.51.yml',15218074700,'ANALYSIS_SHA',845802)]
          rows=[]
          for rid,commit,wf,aid,env,size in parents:
              r=get('/actions/runs/'+str(rid));need(r['status']=='completed' and r['conclusion']=='success' and r['head_sha']==commit and r['path']=='.github/workflows/'+wf and r['run_attempt']==1,'PARENT_RUN')
              subprocess.check_call(['git','merge-base','--is-ancestor',commit,'HEAD'])
              row=dict(run_id=rid,head_sha=commit,created_at=r['created_at'],updated_at=r['updated_at'])
              if aid:
                  a=get('/actions/artifacts/'+str(aid));need(not a['expired'] and a['workflow_run']['id']==rid and a['workflow_run']['head_sha']==commit and a['digest']=='sha256:'+os.environ[env] and a['size_in_bytes']==size,'PARENT_ARTIFACT');row.update(artifact_id=aid,digest=a['digest'])
              rows.append(row)
          need(rows[0]['updated_at']<rows[1]['created_at'] and rows[1]['updated_at']<rows[2]['created_at'] and rows[2]['updated_at']<rows[3]['created_at'],'TEMPORAL_PROVENANCE')
          pathlib.Path('diagnostics_preflight/parents.json').write_text(json.dumps(rows,sort_keys=True,indent=2)+'\n')
          name='hcraf_stage1am_f3_p12r_postconfirm_diagnostics_v05252_sources.zip';raw=pathlib.Path(name).read_bytes();need(hashlib.sha256(raw).hexdigest()==os.environ['SOURCE_SHA'] and subprocess.check_output(['git','show','HEAD:'+name])==raw,'SOURCE_SHA')
          with zipfile.ZipFile(name) as z:
              mn='HCRAF_F3_P12R_POSTCONFIRM_DIAGNOSTICS_SOURCE_SHA256_v05252.json';m=json.loads(z.read(mn));need(z.testzip() is None and len(z.namelist())==len(set(z.namelist())) and set(z.namelist())==set(m['files'])|{mn},'SOURCE_MANIFEST')
              need(all(m[k] is False for k in ('F3_ready','GO_FREEZE','training_ready','heldout_release_authorized','Stage1AO_or_NSGAIII_authorized')) and m['Congestion'] is None and m['FutureCongestion'] is None and all(m[k]==0 for k in ('model_fits_authorized','confirmation_simulations_authorized','diagnostic_rows_authorized')),'LOCKS')
              for n,h in m['files'].items():
                  p=pathlib.PurePosixPath(n);need(p.parts[:2]==('hcraf','episode') and '..' not in p.parts and not p.is_absolute() and chr(92) not in n and not stat.S_ISLNK(z.getinfo(n).external_attr>>16),'PATH')
                  b=z.read(n);need(hashlib.sha256(b).hexdigest()==h,'MEMBER_HASH');d=pathlib.Path(n);need(not d.exists(),'NO_OVERWRITE');d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          print('PASS_AUTHENTICATED_FULL_CONFIRMATION_AND_PRE_CONFIRM_FROZEN_MODELS')
          PYCODE
      - name: Retrieve exact immutable artifact ZIP bytes (no DEV or legacy rows)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for spec in '15207816038 qc' '15193723927 freeze' '15218074700 analysis'; do
            read -r id file <<< "$spec"
            curl --fail --silent --show-error --location --retry 3 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/parhamarjomand-hub/hcraf-ndnsim/actions/artifacts/$id/zip" \
              -o "$RUNNER_TEMP/p12r-$file.zip"
          done
          echo "$ANALYSIS_SHA  $RUNNER_TEMP/p12r-analysis.zip" | sha256sum -c -
          echo "$QC_SHA  $RUNNER_TEMP/p12r-qc.zip" | sha256sum -c -
          echo "$FREEZE_SHA  $RUNNER_TEMP/p12r-freeze.zip" | sha256sum -c -
          echo "$PREREG_SHA  hcraf_stage1am_f3_p12r_fair_comparator_prereg_v05237_sources.zip" | sha256sum -c -
      - name: Test read-only diagnostics and safeguards
        run: |
          set -euo pipefail
          python -m unittest discover -s hcraf/episode/tests -p 'test_stage1am_f3_p12r_v05252.py' -v 2>&1 | tee diagnostics_preflight/tests.log
      - name: Explore existing frozen scores and features only
        run: |
          set -euo pipefail
          python hcraf/episode/scripts/diagnose_stage1am_f3_p12r_v05252.py \
            --qc "$RUNNER_TEMP/p12r-qc.zip" --freeze "$RUNNER_TEMP/p12r-freeze.zip" \
            --prereg hcraf_stage1am_f3_p12r_fair_comparator_prereg_v05237_sources.zip \
            --analysis "$RUNNER_TEMP/p12r-analysis.zip" --output p12r_exploratory 2>&1 | tee diagnostics_preflight/diagnostics.log
      - name: Verify exploratory receipts and preserve NO_GO
        run: |
          set -euo pipefail
          cd p12r_exploratory
          sha256sum -c P12R_OUTPUT_SHA256SUMS.txt
          python - <<'PYCODE'
          import json,pathlib
          r=json.loads(pathlib.Path('P12R_EXPLORATORY_REPORT_v05252.json').read_text())
          def need(ok):
              if not ok:raise RuntimeError('INVALID_EXPLORATORY_RECEIPT')
          need(r['status']=='PASS_P12R_POSTCONFIRM_EXPLORATORY_DIAGNOSTICS_ONLY_NO_F3_RELEASE' and r['parent_scientific_status']=='NO_GO_P12R_CONFIRMATORY_STATISTICAL_GATES_NOT_MET')
          need(r['primary_rows']==27648 and r['seed_blocks']==36 and r['confirmation_cases']==432 and r['exploratory_only'] and r['independent_new_validation_required'])
          need(all(r[k] is False for k in ('F3_ready','GO_FREEZE','training_ready','heldout_release_authorized','Stage1AO_or_NSGAIII_authorized','causal_root_cause_established','new_bootstrap_computed')) and r['Congestion'] is None and r['FutureCongestion'] is None)
          need(all(r[k]==0 for k in ('model_fits','new_candidate_scores','new_hypothesis_tests','new_simulations','heldout_rows_read','diagnostic_injection_rows_used','official_F3_labels_constructed')))
          print('PASS_EXPLORATORY_ONLY_PRIOR_NO_GO_PRESERVED')
          PYCODE
      - name: Always record science fences
        if: always()
        run: |
          mkdir -p diagnostics_preflight
          printf '%s\n' "RUN=$GITHUB_RUN_ID SHA=$GITHUB_SHA VERSION=v0.52.52" 'F3_ready=false GO_FREEZE=false training_ready=false Congestion=null FutureCongestion=null' 'Post hoc exploratory only. Prior NO_GO preserved. No fit, new candidate, bootstrap, simulation or release.' > diagnostics_preflight/science_fences.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hcraf-f3-p12r-postconfirm-diagnostics-v05252-run-${{ github.run_id }}
          path: |
            diagnostics_preflight/
            p12r_exploratory/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hcraf-f3-p12r-postconfirm-diagnostics-failure-v05252-run-${{ github.run_id }}
          path: diagnostics_preflight/
          if-no-files-found: error
          retention-days: 90
