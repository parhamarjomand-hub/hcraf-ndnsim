name: "HCRAF F3 P4 Temporal Regime Preregistration (v0.52.12 P9)"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-new-independent-prospective-temporal-design-with-zero-simulations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V05211_SOURCE_SHA256: "1c64ac3c21b76cc72e398231af8cfebddaad47269c2941d55a82294194541653"
      V05212_SOURCE_SHA256: "050ca15feab2336df4af4607777407bb832da1619bf05bc48a03118a8089985e"
    steps:
      - name: Checkout complete versioned Git ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize prospective design lock and zero-run evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p episode_output/v05212_preflight
          echo 'P9 prospective temporal regime redesign; original v0.52.0/v0.52.4/v0.52.9 unchanged; all training and labels locked; zero simulations.' > episode_output/v05212_preflight/START_HERE.txt

      - name: Authenticate GitHub P8 parent result and immutable 8828 byte artifact digest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          python3 - <<'PY' > episode_output/v05212_preflight/PINNED_P8_PARENT_RECEIPT.log 2>&1
          import json,os,subprocess,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];assert repo=='parhamarjomand-hub/hcraf-ndnsim'
          tok=os.environ['GH_TOKEN'];assert tok
          headers={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','User-Agent':'HCRAF-P4P9-v05212'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as r:return json.load(r)
          base='https://api.github.com/repos/'+repo
          run=get(base+'/actions/runs/44581661928')
          parent='02007bb5a3cdefc3c482954834fb47bf4c0158d4'
          assert run['id']==44581661928 and run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==parent and run['path'].endswith('/hcraf-stage1am-f3-p4-dev-ap-diagnostic-v0.52.11.yml')
          subprocess.check_call(['git','merge-base','--is-ancestor',parent,'HEAD'])
          art=get(base+'/actions/artifacts/14558599038')
          assert art['name']=='hcraf-f3-p4-dev-ap-time-control-v05211-run-44581661928'
          assert art['digest']=='sha256:b490ce65e2ada71d33b70d5e8708ec4985fd4e72e0ee7b6c936fef23875cee91'
          assert not art['expired'] and art.get('workflow_run',{}).get('id')==44581661928
          print('PASS_P8_GITHUB_PARENT_COMMIT_AND_ARTIFACT_DIGEST')
          print('Reason for new design: DEV time-only AP 0.859 exceeds received-queue AP 0.832.')
          PY
          cat episode_output/v05212_preflight/PINNED_P8_PARENT_RECEIPT.log

      - name: Verify P8 and P9 source root ZIP Git preimages all SHA and manifest science locks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > episode_output/v05212_preflight/FULL_SOURCE_HASH_GATES.log 2>&1
          import hashlib,io,json,os,pathlib,stat,subprocess,zipfile
          pins=[('hcraf_stage1am_f3_p4_dev_ap_diagnostic_v05211_sources.zip',
                 'V05211_SOURCE_SHA256','HCRAF_F3_P4_DEV_AP_DIAGNOSTIC_V05211_SOURCE_SHA256.json'),
                ('hcraf_stage1am_f3_p4_temporal_prereg_v05212_sources.zip',
                 'V05212_SOURCE_SHA256','HCRAF_F3_P4_TEMPORAL_PREREG_V05212_SOURCE_SHA256.json')]
          for name,env,manifest_name in pins:
              raw=pathlib.Path(name).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==os.environ[env], 'ROOT_ZIP_CHANGED:'+name
              assert subprocess.check_output(['git','show','HEAD:'+name])==raw, 'ZIP_NOT_COMMITTED:'+name
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  assert z.testzip() is None, 'BAD_ARCHIVE_CRC'
                  names=z.namelist();assert len(names)==len(set(names))
                  m=json.loads(z.read(manifest_name))
                  assert set(names)==set(m['files'])|{manifest_name}, 'MANIFEST_MEMBERS_MISMATCH'
                  for n,sha in m['files'].items():
                      p=pathlib.PurePosixPath(n)
                      assert n and not n.startswith('/') and '..' not in p.parts and '\\' not in n
                      assert not stat.S_ISLNK(z.getinfo(n).external_attr>>16)
                      assert hashlib.sha256(z.read(n)).hexdigest()==sha, 'SOURCE_FILE_SHA_CHANGED:'+n
                  if 'v05212' in name:
                      assert m['stage']=='v0.52.12_P4_P9_TEMPORAL_288_PRE_REGISTERED_DESIGN_ONLY'
                      assert m['parent_run_id']==44581661928 and m['parent_artifact_id']==14558599038
                      assert m['parent_artifact_sha256']=='b490ce65e2ada71d33b70d5e8708ec4985fd4e72e0ee7b6c936fef23875cee91'
                      assert m['registered_conditions']==288 and m['new_simulations']==0
                      assert m['validation_test_executable_now'] is False and m['models_trained']==0
                      assert m['original_v0529_NO_GO_immutable'] is True
                      for k,v in {'Congestion':None,'FutureCongestion':None,'F3_ready':False,
                                  'GO_FREEZE':False,'training_ready':False,
                                  'heldout_release_authorized':False}.items():
                          assert m[k] is v,'SOURCE_SCIENCE_LOCK_BROKEN:'+k
                      root=pathlib.Path('episode_output/v05212_executor')
                      for n in m['files']:
                          target=root/n
                          assert not target.exists(),'REFUSE_OVERWRITE_NEW_SOURCE'
                          target.parent.mkdir(parents=True,exist_ok=True)
                          target.write_bytes(z.read(n))
                  print('PASS_PINNED_ROOT_ARCHIVE_AND_EVERY_FILE_SHA',name,len(m['files']))
          PY
          cat episode_output/v05212_preflight/FULL_SOURCE_HASH_GATES.log

      - name: Verify all 288 prospective rows all locked development CSVs and heldout digests without simulation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH=episode_output/v05212_executor/hcraf/episode/scripts \
            python3 -m unittest discover \
              -s episode_output/v05212_executor/hcraf/episode/tests \
              -p 'test_stage1am_f3_p4_temporal_lock_v05212.py' -v \
              > episode_output/v05212_preflight/TEMPORAL_ORTHOGONAL_288_LOCK_TESTS.log 2>&1
          tail -24 episode_output/v05212_preflight/TEMPORAL_ORTHOGONAL_288_LOCK_TESTS.log

      - name: Always attest no simulations no model training and no release of protected partitions
        if: always()
        shell: bash
        run: |
          set -eu
          mkdir -p episode_output/v05212_preflight
          {
            echo "P9 temporal preregistration only run_id=${GITHUB_RUN_ID} commit=${GITHUB_SHA}"
            echo '0 simulations 0 prospective labels 0 models 0 F3 official PR-AUC'
            echo 'Original v0.52.9 NO_GO remains; Validation/Test executable=false'
            echo 'Congestion=null FutureCongestion=null F3_ready=false GO_FREEZE=false training_ready=false heldout_release_authorized=false'
            echo 'Stage1AO and NSGA-III prohibited'
          } > episode_output/v05212_preflight/SCIENCE_LOCKS_AND_ZERO_EXECUTION.txt

      - name: Always upload small preregistration audit and immutable science fence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-f3-p4-temporal-prereg-v05212-run-${{ github.run_id }}
          path: episode_output/v05212_preflight/
          if-no-files-found: error
          retention-days: 30
