name: "HCRAF F3 Pathwide Bottleneck Relocation DEV Executor ONLY (v0.51.8)"

on:
  workflow_dispatch:
    inputs:
      lock_run_id:
        description: "Successful v0.51.7 Bottleneck Relocation PREREG LOCK Run ID"
        required: true
        type: string
        default: "43242291541"
      shard_id:
        description: "Immutable arm shard 0..7; start with 0 and download each shard artifact"
        required: true
        type: choice
        default: "0"
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"

permissions:
  contents: read
  actions: read

jobs:
  bottleneck-relocation-dev:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 355
    steps:
      - name: Install pinned development dependencies
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update > /tmp/v0518_apt_update.log 2>&1
          apt-get install -y --no-install-recommends git curl ca-certificates build-essential \
            python3 python3-dev python3-setuptools python3-pip python3-pytest \
            pkg-config libboost-all-dev libssl-dev libsqlite3-dev libpcap-dev \
            libgsl-dev libprotobuf-dev protobuf-compiler libxml2-dev libxslt1-dev \
            libevent-dev graphviz doxygen time > /tmp/v0518_apt_install.log 2>&1

      - name: Checkout repository and full Git ancestry
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up permanent preflight and failure diagnostics after checkout
        id: init
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p episode_output/v0518_preflight
          printf 'STARTED; locked matrix must pass before simulation\n' > episode_output/v0518_preflight/START_HERE_ON_FAILURE.txt

      - name: Confirm preregistration Run and exact Artifact exist
        id: discover
        shell: bash
        env:
          LOCK_RUN_ID: ${{ inputs.lock_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > episode_output/v0518_preflight/artifact_discovery.log 2>&1
          import json,os,re,urllib.request,pathlib
          rid=os.environ['LOCK_RUN_ID'].strip(); assert re.fullmatch('[0-9]+',rid),'INVALID_LOCK_RUN_ID'
          repo=os.environ['GITHUB_REPOSITORY'];tok=os.environ['GH_TOKEN'];assert tok
          headers={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28','User-Agent':'HCRAF-v0518-lock-check'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:return json.load(r)
          url=f'https://api.github.com/repos/{repo}/actions/runs/{rid}'
          run=get(url)
          assert run['conclusion']=='success','LOCK_RUN_NOT_SUCCESS'
          assert run['path'].endswith('/hcraf-stage1am-f3-pathwide-bottleneck-relocation-prereg-v0.51.7.yml'),'WRONG_PREREG_WORKFLOW'
          found=[]
          for page in range(1,6):
              batch=get(url+f'/artifacts?per_page=100&page={page}').get('artifacts',[])
              found.extend(batch)
              if len(batch)<100:break
          name='hcraf-f3-bottleneck-relocation-prereg-v0517'
          valid=[a for a in found if a['name']==name and not a['expired']]
          print(json.dumps({'lock_run_id':rid,'workflow_path':run['path'],'run_sha':run['head_sha'],
              'available_artifacts':[a['name'] for a in found],'verified_artifact':name if valid else None},indent=2))
          assert valid,'LOCK_ARTIFACT_NOT_FOUND_OR_EXPIRED'
          PY
          cat episode_output/v0518_preflight/artifact_discovery.log

      - name: Download genuine v0.51.7 GitHub lock Artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: hcraf-f3-bottleneck-relocation-prereg-v0517
          run-id: ${{ inputs.lock_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: episode_output/v0518_preflight/lock_artifact

      - name: Validate lock receipt, Git ancestry and immutable source bytes
        id: lineage
        shell: bash
        env:
          LOCK_RUN_ID: ${{ inputs.lock_run_id }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          python3 - <<'PY' > episode_output/v0518_preflight/lineage.log 2>&1
          import hashlib,json,os,pathlib,subprocess
          receipt=json.loads(pathlib.Path('episode_output/v0518_preflight/lock_artifact/prereg_lock_receipt.json').read_text())
          rid=os.environ['LOCK_RUN_ID'];locksha=receipt['git_commit_sha']
          assert receipt['status']=='PASS_PATHWIDE_BOTTLENECK_RELOCATION_PREREG_LOCK_ONLY_NO_NDNSIM_RUN'
          assert str(receipt['github_run_id'])==rid=='43242291541','LOCK_RUN_ID_MISMATCH'
          assert locksha=='a77704bb631cf2fac74ade2e28bc7c19b9b0fb53','LOCK_SHA_CHANGED'
          assert receipt['planned_runs']==216 and receipt['monitored_runs']==192 and receipt['unmonitored_runs']==24
          assert receipt['matrix_sha256']=='6c66dfefce2abcc73e8c07fdb0afa7ef892524e74b8eb2a004a4181942180649'
          assert all(receipt[k] is v for k,v in {'Congestion':None,'FutureCongestion':None,'F3_ready':False,'GO_FREEZE':False,'training_ready':False}.items())
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          subprocess.check_call(['git','merge-base','--is-ancestor',locksha,head])
          source='hcraf_stage1am_f3_bottleneck_relocation_prereg_v0517_sources.zip'
          expected='76a1a0e184f471a7fb3d78b8a44213e0d47a852fa45311b74e73795a1a557a05'
          current=pathlib.Path(source).read_bytes()
          committed=subprocess.check_output(['git','show',locksha+':'+source])
          assert hashlib.sha256(current).hexdigest()==hashlib.sha256(committed).hexdigest()==expected,'LOCKED_PREREG_ZIP_CHANGED'
          print(json.dumps({'status':'PASS_IMMUTABLE_GIT_PREREG_LINEAGE','lock_run_id':rid,'lock_sha':locksha,'executor_sha':head},indent=2))
          PY
          cat episode_output/v0518_preflight/lineage.log

      - name: Safely restore old pinned sources, prereg contract, and new additive Executor
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > episode_output/v0518_preflight/extraction.log 2>&1
          import hashlib,json,pathlib,stat,zipfile
          archives=[
            ('hcraf_stage1am_f3_mixed_sources.zip','f21a132299e88fdee65397b7d846c3fa47bc7ee041dd6a161e7bd48651c925da','.',None),
            ('hcraf_stage1s_approved_reference.zip','b4fe49f0796ca6f12b2f140931e3158c6278dc5742309ea4c3f5f79c5502b8c4','artifact',None),
            ('hcraf_stage1am_f3_pathwide_witness_dev_v0515_sources.zip','bfbd90c638692ba241a161eaf5dcadfbc7dceae82ba4d5f236e863b2d849b28f','.',
                  'HCRAF_F3_PATHWIDE_WITNESS_DEV_V0515_SOURCE_SHA256.json'),
            ('hcraf_stage1am_f3_bottleneck_relocation_prereg_v0517_sources.zip','76a1a0e184f471a7fb3d78b8a44213e0d47a852fa45311b74e73795a1a557a05','.',
                  'HCRAF_F3_BOTTLENECK_RELOCATION_PREREG_V0517_SOURCE_SHA256.json'),
            ('hcraf_stage1am_f3_bottleneck_relocation_executor_v0518_sources.zip','a2723c201b48d61e862d24d7cfc51e08b4782642d3e9b3e480aea9961dba788d','.',
                  'HCRAF_F3_BOTTLENECK_RELOCATION_EXECUTOR_V0518_SHA256.json')]
          for filename,expected,destination,manifest in archives:
              data=pathlib.Path(filename).read_bytes()
              assert hashlib.sha256(data).hexdigest()==expected,'SOURCE_ZIP_HASH_CHANGED:'+filename
              with zipfile.ZipFile(filename) as z:
                  assert z.testzip() is None,'ZIP_CRC_FAILED:'+filename
                  names=z.namelist();assert len(names)==len(set(names)),'ZIP_DUPLICATES:'+filename
                  m=json.loads(z.read(manifest))['files'] if manifest else None
                  if m:assert set(m)|{manifest}==set(names),'SOURCE_MANIFEST_MEMBER_SET_CHANGED'
                  for n in names:
                      if n.endswith('/'):continue
                      p=pathlib.PurePosixPath(n)
                      assert not n.startswith('/') and '..' not in p.parts and '\\' not in n,'UNSAFE_ZIP_MEMBER'
                      assert not stat.S_ISLNK(z.getinfo(n).external_attr>>16),'ZIP_SYMLINK_REJECTED'
                      b=z.read(n)
                      if m and n!=manifest:assert hashlib.sha256(b).hexdigest()==m[n],'MANIFEST_HASH_MISMATCH:'+n
                      target=pathlib.Path(destination).joinpath(*p.parts)
                      target.parent.mkdir(parents=True,exist_ok=True)
                      if target.exists():assert target.read_bytes()==b,'REFUSE_OVERWRITE_DIFFERENT_BYTES:'+n
                      else:target.write_bytes(b)
                      if n.endswith('.sh'):target.chmod(0o755)
                  print('RESTORED',filename,len(names))
          prev=json.loads(pathlib.Path('HCRAF_STAGE1AM_V047_SOURCE_SHA256.json').read_text())['files']
          assert len(prev)==295
          for n,sha in prev.items():assert hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==sha,'HISTORIC_FILE_CHANGED:'+n
          PY
          cat episode_output/v0518_preflight/extraction.log

      - name: Verify prospective matrix and run only new Executor unit tests
        id: tests
        shell: bash
        env:
          SHARD_ID: ${{ inputs.shard_id }}
        run: |
          set -euo pipefail
          contract=hcraf/episode/docs/1AM/F3_PATHWIDE_BOTTLENECK_RELOCATION_PREREG_v0.51.7
          python3 "$contract/generate_prereg.py" --verify "$contract" > episode_output/v0518_preflight/locked_design_verification.json
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s hcraf/episode/tests -p 'test_stage1am_f3_bottleneck_relocation_executor_v0518.py' -v > episode_output/v0518_preflight/executor_unit_tests.log 2>&1
          tail -15 episode_output/v0518_preflight/executor_unit_tests.log
          python3 hcraf/episode/scripts/run_stage1am_f3_bottleneck_relocation_dev.py --shard-id "$SHARD_ID" --preflight-only > episode_output/v0518_preflight/shard_preflight.json
          printf '20 historical Stage1S fixture-dependent tests remain deferred, not PASS.\n' > episode_output/v0518_preflight/INCOMPLETE_HISTORICAL_REGRESSION.txt

      - name: Compile standalone bottleneck-relocation ndnSIM scenario
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          bash hcraf/episode/scripts/build_stage1am_f3_bottleneck_relocation_dev.sh > episode_output/v0518_preflight/cpp_build.log 2>&1
          tail -20 episode_output/v0518_preflight/cpp_build.log

      - name: Execute and audit exactly one locked 27-run arm shard
        id: simulate
        shell: bash
        env:
          SHARD_ID: ${{ inputs.shard_id }}
        run: |
          set -euo pipefail
          python3 hcraf/episode/scripts/run_stage1am_f3_bottleneck_relocation_dev.py --shard-id "$SHARD_ID" > episode_output/v0518_preflight/shard_simulation_and_audit.log 2>&1
          tail -20 episode_output/v0518_preflight/shard_simulation_and_audit.log

      - name: Persist diagnostics even on early failure
        id: diagnostics
        if: always()
        shell: bash
        env:
          STEP_DEPS: ${{ steps.deps.outcome }}
          STEP_CHECKOUT: ${{ steps.checkout.outcome }}
          STEP_DISCOVER: ${{ steps.discover.outcome }}
          STEP_DOWNLOAD: ${{ steps.download.outcome }}
          STEP_LINEAGE: ${{ steps.lineage.outcome }}
          STEP_RESTORE: ${{ steps.restore.outcome }}
          STEP_TESTS: ${{ steps.tests.outcome }}
          STEP_COMPILE: ${{ steps.compile.outcome }}
          STEP_SIMULATE: ${{ steps.simulate.outcome }}
          SHARD_ID: ${{ inputs.shard_id }}
        run: |
          set -u
          mkdir -p episode_output/v0518_preflight
          {
            echo "v0.51.8 bottleneck-relocation Executor diagnostics"
            echo "run_id=${GITHUB_RUN_ID:-unknown}"
            echo "git_sha=${GITHUB_SHA:-unknown}"
            echo "shard_id=$SHARD_ID"
            echo "deps=$STEP_DEPS checkout=$STEP_CHECKOUT artifact_discovery=$STEP_DISCOVER"
            echo "download=$STEP_DOWNLOAD lineage=$STEP_LINEAGE restore=$STEP_RESTORE"
            echo "tests=$STEP_TESTS compile=$STEP_COMPILE simulation=$STEP_SIMULATE"
            echo "F3_ready=false GO_FREEZE=false training_ready=false"
          } > episode_output/v0518_preflight/EXECUTOR_RUN_DIAGNOSTICS.txt
          find episode_output -maxdepth 3 -type f | sort > episode_output/v0518_preflight/OUTPUT_INVENTORY.txt
          cp /tmp/v0518_apt_update.log episode_output/v0518_preflight/apt_update.log 2>/dev/null || true
          cp /tmp/v0518_apt_install.log episode_output/v0518_preflight/apt_install.log 2>/dev/null || true
          test -s episode_output/v0518_preflight/EXECUTOR_RUN_DIAGNOSTICS.txt

      - name: Upload output of this shard or useful failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-f3-bottleneck-relocation-dev-v0518-shard-${{ inputs.shard_id }}-run-${{ github.run_id }}
          path: |
            episode_output/v0518_preflight/
            episode_output/stage1am_f3_bottleneck_relocation_dev/
            episode_output/stage1am_f3_bottleneck_relocation_report/
          if-no-files-found: error
          retention-days: 30
