name: "HCRAF F3 Bottleneck Relocation Shard 0 Recovery ONLY (v0.51.8 P1)"

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Failed v0.51.8 Shard 0 Run ID; reuse its existing 27 simulations"
        required: true
        type: string
        default: "43248203936"

permissions:
  contents: read
  actions: read

jobs:
  recover-shard-0:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project without modifying earlier sources
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare diagnostics and confirm original failed Run identity
        id: identity
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p episode_output/v0518_recovery
          python3 - <<'PY' > episode_output/v0518_recovery/source_run_check.json
          import json,os,urllib.request
          rid=os.environ['SOURCE_RUN_ID']
          assert rid=='43248203936','RECOVERY_ONLY_EXPECTED_FAILED_SHARD0_RUN'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28','User-Agent':'HCRAF-recovery-v0518-p1'}
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+rid
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as u:run=json.load(u)
          assert run['path'].endswith('/hcraf-stage1am-f3-bottleneck-relocation-dev-v0.51.8.yml'),'WRONG_ORIGINAL_WORKFLOW'
          assert run['head_sha']=='bdfef1cd118b3d17392f6f8e1b518eea5ab227ce','ORIGINAL_RUN_SHA_CHANGED'
          assert run['status']=='completed' and run['conclusion']=='failure','ORIGINAL_RUN_NOT_EXPECTED_FAILED_RUN'
          print(json.dumps({'status':'PASS_ORIGINAL_FAILED_RUN_PROVENANCE','run_id':rid,'git_sha':run['head_sha'],'original_conclusion':run['conclusion']},indent=2))
          PY

      - name: Download original 27-run Artifact without re-executing ndnSIM
        id: download
        uses: actions/download-artifact@v4
        with:
          name: hcraf-f3-bottleneck-relocation-dev-v0518-shard-0-run-43248203936
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: episode_output

      - name: Read immutable sources, apply schema repair, and audit existing runs
        id: audit
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,hashlib,pathlib
          p=pathlib.Path('hcraf_stage1am_f3_bottleneck_relocation_v0518_hotfix_p1_sources.zip')
          assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()=='680cb2dd37b1cf9ca27e2607bd6bb53212e2dd9eb1ebd4cd57bb2254572fe37f','HOTFIX_ARCHIVE_MISSING_OR_CHANGED'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None,'HOTFIX_CRC_FAILED'
              member='hcraf/episode/scripts/repair_stage1am_f3_bottleneck_relocation_v0518_p1.py'
              target=pathlib.Path('episode_output/v0518_recovery/repair_stage1am_f3_bottleneck_relocation_v0518_p1.py')
              target.write_bytes(z.read(member))
          PY
          python3 episode_output/v0518_recovery/repair_stage1am_f3_bottleneck_relocation_v0518_p1.py recover --source-run-id "$SOURCE_RUN_ID" > episode_output/v0518_recovery/recovery_stdout.json 2> episode_output/v0518_recovery/recovery_stderr.log
          cat episode_output/v0518_recovery/recovery_stdout.json

      - name: Always save diagnostic outcome and artifact inventory
        if: always()
        shell: bash
        env:
          STEP_CHECKOUT: ${{ steps.checkout.outcome }}
          STEP_IDENTITY: ${{ steps.identity.outcome }}
          STEP_DOWNLOAD: ${{ steps.download.outcome }}
          STEP_AUDIT: ${{ steps.audit.outcome }}
        run: |
          mkdir -p episode_output/v0518_recovery
          printf 'checkout=%s\nidentity=%s\ndownload=%s\naudit=%s\nsimulations_reexecuted=0\n' "$STEP_CHECKOUT" "$STEP_IDENTITY" "$STEP_DOWNLOAD" "$STEP_AUDIT" > episode_output/v0518_recovery/STEPS.txt
          find episode_output/v0518_recovery episode_output/stage1am_f3_bottleneck_relocation_report -maxdepth 3 -type f 2>/dev/null | sort > episode_output/v0518_recovery/OUTPUT_INVENTORY.txt || true

      - name: Upload recovered reconciliation or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-f3-bottleneck-relocation-v0518-shard0-recovered-audit-${{ github.run_id }}
          path: |
            episode_output/v0518_recovery/
            episode_output/stage1am_f3_bottleneck_relocation_report/
          if-no-files-found: error
          retention-days: 30
