name: "HCRAF F3 Bottleneck Relocation Shard 1 Recovery ONLY (v0.51.8 P2)"

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Original completed Shard 1 simulation Run ID, no resimulation"
        type: string
        required: true
        default: "43261271719"

permissions:
  contents: read
  actions: read

jobs:
  recover-shard-1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize diagnostics and verify original Run identity
        id: identity
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p episode_output/v0518_recovery_shard1
          python3 - <<'PY' > episode_output/v0518_recovery_shard1/source_run_check.json
          import json,os,urllib.request
          rid=os.environ['SOURCE_RUN_ID'].strip()
          assert rid=='43261271719','RECOVERY_P2_EXPECTS_SHARD1_RUN_43261271719'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',
                   'User-Agent':'HCRAF-v0518-shard1-recovery-p2'}
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+rid
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:run=json.load(r)
          assert run['path'].endswith('/hcraf-stage1am-f3-bottleneck-relocation-dev-v0.51.8.yml'),'WRONG_ORIGINAL_WORKFLOW'
          assert run['head_sha']=='5ebc2b0b62bc4519c945fad63d734bc8b45c7598','WRONG_SOURCE_COMMIT'
          assert run['status']=='completed' and run['conclusion']=='failure','ORIGINAL_RUN_NOT_THE_EXPECTED_FAILURE'
          print(json.dumps({'status':'PASS_SOURCE_SHARD1_IDENTITY','run_id':rid,'sha':run['head_sha']},indent=2))
          PY

      - name: Download existing Shard 1 data, DO NOT rerun simulation
        id: download
        uses: actions/download-artifact@v4
        with:
          name: hcraf-f3-bottleneck-relocation-dev-v0518-shard-1-run-43261271719
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: episode_output

      - name: Restore pinned sources, repair verifier, audit Shard 1 only
        id: audit
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib,zipfile,json
          p=pathlib.Path('hcraf_stage1am_f3_bottleneck_relocation_v0518_hotfix_p2_sources.zip')
          assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()=='8b7c49d9ed88b64acb707ccd94cae89945a8a29441fa6cba53c838af01e0c483','P2_SOURCE_ZIP_MISSING_OR_CHANGED'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None,'HOTFIX_P2_CRC_FAILURE'
              for member in ['hcraf/episode/scripts/repair_stage1am_f3_bottleneck_relocation_v0518_p1.py','hcraf/episode/scripts/recover_stage1am_f3_bottleneck_relocation_shard1_v0518_p2.py']:
                  target=pathlib.Path('episode_output/v0518_recovery_shard1')/pathlib.Path(member).name
                  target.write_bytes(z.read(member))
          PY
          python3 episode_output/v0518_recovery_shard1/recover_stage1am_f3_bottleneck_relocation_shard1_v0518_p2.py --source-run-id "$SOURCE_RUN_ID" > episode_output/v0518_recovery_shard1/recovery_stdout.json 2> episode_output/v0518_recovery_shard1/recovery_stderr.log
          cat episode_output/v0518_recovery_shard1/RECOVERY_RECEIPT.json

      - name: Always record step status, even on failure
        id: diagnostics
        if: always()
        shell: bash
        env:
          STEP_CHECKOUT: ${{ steps.checkout.outcome }}
          STEP_IDENTITY: ${{ steps.identity.outcome }}
          STEP_DOWNLOAD: ${{ steps.download.outcome }}
          STEP_AUDIT: ${{ steps.audit.outcome }}
        run: |
          mkdir -p episode_output/v0518_recovery_shard1
          printf 'checkout=%s\nidentity=%s\ndownload=%s\naudit=%s\nsimulations_reexecuted=0\n' "$STEP_CHECKOUT" "$STEP_IDENTITY" "$STEP_DOWNLOAD" "$STEP_AUDIT" > episode_output/v0518_recovery_shard1/STEPS.txt
          find episode_output/v0518_recovery_shard1 episode_output/stage1am_f3_bottleneck_relocation_report -maxdepth 3 -type f 2>/dev/null | sort > episode_output/v0518_recovery_shard1/OUTPUT_INVENTORY.txt || true

      - name: Always upload audit report or early-failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-f3-bottleneck-relocation-v0518-shard1-recovered-audit-${{ github.run_id }}
          path: |
            episode_output/v0518_recovery_shard1/
            episode_output/stage1am_f3_bottleneck_relocation_report/
          if-no-files-found: error
          retention-days: 30
