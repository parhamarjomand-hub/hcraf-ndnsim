name: "HCRAF F3 NDN Queue Telemetry Transport TECHNICAL SMOKE HOTFIX P1 (v0.52.2)"

on:
  workflow_dispatch:
    inputs:
      lock_run_id:
        description: "Locked v0.52.0 prereg GitHub run, only for historical TECHNICAL traffic fixture"
        required: true
        type: string
        default: "43567814962"

permissions:
  contents: read
  actions: read

jobs:
  network-telemetry-smoke-only:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 355
    steps:
      - name: Install build dependencies
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update > /tmp/v0522_apt_update.log 2>&1
          apt-get install -y --no-install-recommends git curl ca-certificates build-essential \
            python3 python3-dev python3-setuptools python3-pip python3-pytest \
            pkg-config libboost-all-dev libssl-dev libsqlite3-dev libpcap-dev \
            libgsl-dev libprotobuf-dev protobuf-compiler libxml2-dev libxslt1-dev \
            libevent-dev graphviz doxygen time > /tmp/v0522_apt_install.log 2>&1

      - name: Checkout full history
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize failure-safe diagnostics
        id: init
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p episode_output/v0522_telemetry_preflight
          echo 'V0522 TECHNICAL NDN TRANSPORT ONLY; NO F3 / HELDOUT / TRAINING' > episode_output/v0522_telemetry_preflight/START_HERE_ON_FAILURE.txt

      - name: Verify real pinned parent lock run and artifact
        id: discover
        shell: bash
        env:
          LOCK_RUN_ID: ${{ inputs.lock_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > episode_output/v0522_telemetry_preflight/artifact_discovery.log 2>&1
          import json,os,re,urllib.request
          rid=os.environ['LOCK_RUN_ID']
          assert re.fullmatch(r'[0-9]+',rid) and rid=='43567814962','WRONG_OR_UNKNOWN_PARENT_LOCK'
          repo=os.environ['GITHUB_REPOSITORY'];tok=os.environ['GH_TOKEN'];assert tok
          h={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','User-Agent':'HCRAF-v0522-SMOKE'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=45) as r:return json.load(r)
          u=f'https://api.github.com/repos/{repo}/actions/runs/{rid}'
          run=get(u)
          assert run.get('conclusion')=='success','LOCK_RUN_NOT_SUCCESS'
          assert run.get('head_sha')=='3808ddcebc4480eefbe64f0a16c69afd35f05dcd','PARENT_SHA_CHANGED'
          assert run.get('path','').endswith('/hcraf-stage1am-f3-future-path-queue-pressure-prereg-v0.52.0.yml'),'PARENT_WORKFLOW_CHANGED'
          artifacts=[]
          for page in range(1,7):
              a=get(u+f'/artifacts?per_page=100&page={page}').get('artifacts',[]);artifacts.extend(a)
              if len(a)<100:break
          assert any(a['name']=='hcraf-f3-future-path-queue-pressure-prereg-v0520' and not a['expired'] for a in artifacts),'PARENT_ARTIFACT_MISSING'
          print('PASS_PINNED_LOCK_RUN_AND_ARTIFACT')
          PY
          cat episode_output/v0522_telemetry_preflight/artifact_discovery.log

      - name: Download v0.52.0 historical technical fixture lock
        id: download
        uses: actions/download-artifact@v4
        with:
          name: hcraf-f3-future-path-queue-pressure-prereg-v0520
          run-id: ${{ inputs.lock_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: episode_output/v0522_telemetry_preflight/lock_artifact

      - name: Verify immutable source SHA-256 and restore through fail-closed extractor
        id: restore
        shell: bash
        env:
          LOCK_RUN_ID: ${{ inputs.lock_run_id }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          python3 - <<'PY' > episode_output/v0522_telemetry_preflight/source_restore.log 2>&1
          import hashlib,json,os,pathlib,stat,subprocess,zipfile
          lock=json.loads(pathlib.Path('episode_output/v0522_telemetry_preflight/lock_artifact/prereg_lock_receipt.json').read_text())
          assert lock['result']=='PASS_V0520_CONSTRUCT_PREREG_LOCK_ONLY_NO_NDNSIM'
          assert str(lock['github_run_id'])==os.environ['LOCK_RUN_ID']=='43567814962'
          assert lock['git_commit_sha']=='3808ddcebc4480eefbe64f0a16c69afd35f05dcd'
          assert lock['planned_runs']==648 and lock['calibration_runs']==216 and lock['heldout_runs']==432
          assert lock['matrix_sha256']=='920c190702526ad11efc10781ce23c629e7918932b4c52159fbfb96234600bd3'
          assert lock['source_zip_sha256']=='0523ad0ef216426d128596fdf15bc91e1c78523346dab2bbd843c16cf139601e'
          assert not lock['heldout_release_authorized'] and not lock['model_frozen'] and lock['simulations_executed']==0
          for k,v in {'Congestion':None,'FutureCongestion':None,'F3_ready':False,'GO_FREEZE':False,'training_ready':False}.items():assert lock[k] is v,k
          subprocess.check_call(['git','merge-base','--is-ancestor',lock['git_commit_sha'],'HEAD'])
          committed=subprocess.check_output(['git','show',lock['git_commit_sha']+':hcraf_stage1am_f3_future_path_queue_pressure_prereg_v0520_sources.zip'])
          assert hashlib.sha256(committed).hexdigest()==lock['source_zip_sha256']
          zips=[
           ('hcraf_stage1am_f3_mixed_sources.zip','f21a132299e88fdee65397b7d846c3fa47bc7ee041dd6a161e7bd48651c925da','.',None,None),
           ('hcraf_stage1s_approved_reference.zip','b4fe49f0796ca6f12b2f140931e3158c6278dc5742309ea4c3f5f79c5502b8c4','artifact',None,None),
           ('hcraf_stage1am_f3_pathwide_witness_dev_v0515_sources.zip','bfbd90c638692ba241a161eaf5dcadfbc7dceae82ba4d5f236e863b2d849b28f','.', 'HCRAF_F3_PATHWIDE_WITNESS_DEV_V0515_SOURCE_SHA256.json','files'),
           ('hcraf_stage1am_f3_future_path_queue_pressure_prereg_v0520_sources.zip','0523ad0ef216426d128596fdf15bc91e1c78523346dab2bbd843c16cf139601e','.', 'HCRAF_F3_FUTURE_PATH_QUEUE_PRESSURE_V0520_SOURCE_SHA256.json','source_files'),
           ('hcraf_stage1am_f3_future_path_queue_calibration_executor_v0521_sources.zip','30ca65f18895d24c0b23f5e44fa8504737aa6b19c0093c48976b3a67568381cc','.', 'HCRAF_F3_FUTURE_PATH_QUEUE_CALIBRATION_EXECUTOR_V0521_SOURCE_SHA256.json','files'),
           ('hcraf_stage1am_f3_queue_telemetry_dev_v0522_sources.zip','76af91b0d94754f21b53922b412c5c7882a4612c1cb702d8c95764fbab5845c6','.', 'HCRAF_F3_QUEUE_TELEMETRY_V0522_SOURCE_SHA256.json','files')]
          for fn,sha,root,manifest,field in zips:
              raw=pathlib.Path(fn).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==sha,'UNEXPECTED_SOURCE_ZIP:'+fn
              with zipfile.ZipFile(fn) as z:
                  assert z.testzip() is None,'CRC_ERROR:'+fn
                  names=z.namelist();assert len(names)==len(set(names)),'DUPLICATE_ARCHIVE_ENTRIES:'+fn
                  hashes=json.loads(z.read(manifest))[field] if manifest else None
                  if hashes is not None:assert set(hashes)|{manifest}==set(names),'HASH_MANIFEST_MISMATCH:'+fn
                  for name in names:
                      if name.endswith('/'):continue
                      p=pathlib.PurePosixPath(name)
                      assert not name.startswith('/') and '..' not in p.parts and '\\' not in name,'UNSAFE_ZIP_MEMBER'
                      assert not stat.S_ISLNK(z.getinfo(name).external_attr>>16),'SYMLINK_REFUSED'
                      data=z.read(name)
                      if hashes is not None and name!=manifest:assert hashlib.sha256(data).hexdigest()==hashes[name],'FILE_SHA_MISMATCH:'+name
                      dest=pathlib.Path(root).joinpath(*p.parts);dest.parent.mkdir(parents=True,exist_ok=True)
                      if dest.exists():assert dest.read_bytes()==data,'REFUSE_OVERWRITE_CHANGED_SOURCE:'+name
                      else:dest.write_bytes(data)
                      if dest.suffix=='.sh':dest.chmod(0o755)
                  print('RESTORED',fn,len(names))
          assert len(json.loads(pathlib.Path('HCRAF_STAGE1AM_V047_SOURCE_SHA256.json').read_text())['files'])==295
          print('PASS_SCIENCE_LOCK_AND_SAFE_SOURCE_RESTORE')
          PY
          cat episode_output/v0522_telemetry_preflight/source_restore.log

      - name: Apply FAIL-CLOSED telemetry namespace separation Hotfix P1
        id: hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > episode_output/v0522_telemetry_preflight/hotfix_p1.log 2>&1
          import hashlib,json,pathlib,stat,subprocess,zipfile
          package=pathlib.Path('hcraf_stage1am_f3_queue_telemetry_dev_v0522_hotfix_p1_sources.zip')
          expected='2f1666e3afa01e4117231ac9f0373abbaf55e6b7a0b9f4ddcd546c5caf00c35b'
          blob=package.read_bytes()
          assert hashlib.sha256(blob).hexdigest()==expected,'P1_ZIP_SHA_MISMATCH'
          # Confirm the exact ZIP is committed; no generated or untracked source.
          committed=subprocess.check_output(['git','show','HEAD:'+package.name])
          assert committed==blob,'P1_SOURCE_ZIP_NOT_COMMITTED_AT_HEAD'
          with zipfile.ZipFile(package) as z:
              assert z.testzip() is None,'P1_BAD_ZIP_CRC'
              names=z.namelist()
              assert len(names)==len(set(names)),'P1_DUPLICATE_ZIP_MEMBER'
              manifest_name='HCRAF_F3_QUEUE_TELEMETRY_V0522_P1_SOURCE_SHA256.json'
              m=json.loads(z.read(manifest_name))
              assert m['stage']=='v0.52.2_QUEUE_TELEMETRY_DEV_HOTFIX_P1_ONLY'
              assert m['fix']=='disjoint_NDN_control_namespace_/hcraf-queue-telemetry'
              assert set(names)==set(m['files'])|{manifest_name},'P1_EXTRA_OR_MISSING_FILES'
              assert m['Congestion'] is None and m['FutureCongestion'] is None
              assert all(m[k] is False for k in ('F3_ready','GO_FREEZE','training_ready'))
              pending=[]
              for name,after in m['files'].items():
                  path=pathlib.PurePosixPath(name)
                  assert not name.startswith('/') and '..' not in path.parts and '\\' not in name,'P1_UNSAFE_PATH'
                  assert not stat.S_ISLNK(z.getinfo(name).external_attr>>16),'P1_SYMLINK_REFUSED'
                  data=z.read(name)
                  assert hashlib.sha256(data).hexdigest()==after,'P1_CONTENT_SHA_MISMATCH:'+name
                  dest=pathlib.Path(*path.parts)
                  if name in m['preimages_sha256']:
                      old=dest.read_bytes()
                      assert hashlib.sha256(old).hexdigest()==m['preimages_sha256'][name], 'P1_PARENT_PREIMAGE_MISMATCH:'+name
                  else:
                      assert not dest.exists(),'P1_REFUSE_DOC_OVERWRITE:'+name
                  pending.append((dest,data))
              # Only write after validating *all* parents and content hashes.
              for dest,data in pending:
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(data)
              cpp=pathlib.Path('hcraf/episode/src/hcraf-stage1am-f3-queue-telemetry-smoke-v0522.cpp').read_text()
              assert '/hcraf/telemetry' not in cpp,'P1_OLD_NAMESPACE_REMAINED'
              assert cpp.count('/hcraf-queue-telemetry')==8,'P1_INCONSISTENT_NDN_NAMES'
              assert '/hcraf/pilot' in cpp and '/hcraf/competitor' in cpp
              assert not ('/hcraf-queue-telemetry'=='/hcraf' or '/hcraf-queue-telemetry'.startswith('/hcraf/'))
          print('PASS_P1_TELEMETRY_NAMESPACE_SEPARATION_PATCH_ONLY')
          print('parent_run=43738030095; original C++ and tests match SHA-256 preimages')
          print('Target/Competitor, NFD selection, labels, science locks: unchanged')
          PY
          cat episode_output/v0522_telemetry_preflight/hotfix_p1.log

      - name: Run structural and causal schema selftests (simulator-free)
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s hcraf/episode/tests -p 'test_stage1am_f3_queue_telemetry_smoke_v0522.py' -v \
            > episode_output/v0522_telemetry_preflight/tests.log 2>&1
          python3 hcraf/episode/scripts/validate_online_queue_telemetry_v0522.py --selftest \
            --summary episode_output/v0522_telemetry_preflight/synthetic_schema_test.json
          python3 hcraf/episode/scripts/run_stage1am_f3_queue_telemetry_smoke_v0522.py --preflight-only \
            > episode_output/v0522_telemetry_preflight/technical_fixture_preflight.json
          printf '20 historical Stage1S tests remain deferred, NOT PASSED.\n' \
            > episode_output/v0522_telemetry_preflight/STAGE1S_DEFERRED.txt

      - name: Compile NEW NDN telemetry transport C++ binary
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          bash hcraf/episode/scripts/build_stage1am_f3_queue_telemetry_smoke_v0522.sh \
            > episode_output/v0522_telemetry_preflight/cpp_build.log 2>&1
          tail -20 episode_output/v0522_telemetry_preflight/cpp_build.log

      - name: Run exactly 9 transport-only smoke simulations
        id: simulate
        shell: bash
        run: |
          set -euo pipefail
          python3 hcraf/episode/scripts/run_stage1am_f3_queue_telemetry_smoke_v0522.py \
            > episode_output/v0522_telemetry_preflight/smoke_and_audit.log 2>&1
          tail -25 episode_output/v0522_telemetry_preflight/smoke_and_audit.log

      - name: Always preserve diagnostics and partial output
        if: always()
        id: diagnostics
        shell: bash
        env:
          STEP_CHECKOUT: ${{ steps.checkout.outcome }}
          STEP_DEPS: ${{ steps.deps.outcome }}
          STEP_DISCOVER: ${{ steps.discover.outcome }}
          STEP_DOWNLOAD: ${{ steps.download.outcome }}
          STEP_RESTORE: ${{ steps.restore.outcome }}
          STEP_HOTFIX: ${{ steps.hotfix.outcome }}
          STEP_TESTS: ${{ steps.tests.outcome }}
          STEP_COMPILE: ${{ steps.compile.outcome }}
          STEP_SIMULATE: ${{ steps.simulate.outcome }}
        run: |
          set -u
          mkdir -p episode_output/v0522_telemetry_preflight
          {
            echo 'v0.52.2 NDN network telemetry SMOKE only — NO HELDOUT / NO F3 validation'
            echo "github_run_id=${GITHUB_RUN_ID:-unknown}"
            echo "git_sha=${GITHUB_SHA:-unknown}"
            echo "checkout=$STEP_CHECKOUT deps=$STEP_DEPS discover=$STEP_DISCOVER download=$STEP_DOWNLOAD"
            echo "restore=$STEP_RESTORE hotfix_p1=$STEP_HOTFIX tests=$STEP_TESTS compile=$STEP_COMPILE simulate=$STEP_SIMULATE"
            echo 'Congestion=null FutureCongestion=null F3_ready=false GO_FREEZE=false training_ready=false'
          } > episode_output/v0522_telemetry_preflight/EXECUTOR_RUN_DIAGNOSTICS.txt
          find episode_output -maxdepth 6 -type f | sort > episode_output/v0522_telemetry_preflight/OUTPUT_INVENTORY.txt
          cp /tmp/v0522_apt_update.log episode_output/v0522_telemetry_preflight/apt_update.log 2>/dev/null || true
          cp /tmp/v0522_apt_install.log episode_output/v0522_telemetry_preflight/apt_install.log 2>/dev/null || true

      - name: Upload raw network evidence or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-f3-ndn-queue-telemetry-smoke-v0522-p1-run-${{ github.run_id }}
          path: |
            episode_output/v0522_telemetry_preflight/
            episode_output/stage1am_f3_telemetry_smoke_v0522/
          if-no-files-found: error
          retention-days: 30
