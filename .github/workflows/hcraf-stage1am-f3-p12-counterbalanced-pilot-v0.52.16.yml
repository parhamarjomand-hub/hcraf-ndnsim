name: "HCRAF F3 P12 Counterbalanced Physical PILOT 24 (v0.52.16 P12B)"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  execute-p12a-locked-twenty-four-permanently-excluded-pilot-cases:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 355
    env:
      V0526_SOURCE_SHA256: "bc18ad86a07036250b3ec488df90e7d1936706b56185fac0a942d4ca6bc08d63"
      V05216_SOURCE_SHA256: "33b4c9d18d1f0f3cef581ce4e2b8e983295eb678d67a3939a8b4faa786fcc0b5"
    steps:
      - name: Install pinned ndnSIM dependencies with bounded retry and cache
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          : > /tmp/p12b_apt_update.log
          : > /tmp/p12b_apt_install.log
          sed -i '/focal-backports/d' /etc/apt/sources.list
          sed -i 's#http://archive.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
          for attempt in 1 2 3; do
            if [ "$attempt" -eq 2 ]; then
              sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
              sed -i 's#http://security.ubuntu.com/ubuntu#https://security.ubuntu.com/ubuntu#g' /etc/apt/sources.list
            elif [ "$attempt" -eq 3 ]; then
              sed -i 's#https://archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
              sed -i 's#https://security.ubuntu.com/ubuntu#http://security.ubuntu.com/ubuntu#g' /etc/apt/sources.list
            fi
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 \
              -o Acquire::https::Timeout=25 update >> /tmp/p12b_apt_update.log 2>&1 || true
            if apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 \
              -o Acquire::https::Timeout=25 install -y --no-install-recommends \
              git curl ca-certificates build-essential \
              python3 python3-dev python3-setuptools python3-pip python3-pytest \
              pkg-config libboost-all-dev libssl-dev libsqlite3-dev libpcap-dev \
              libgsl-dev libprotobuf-dev protobuf-compiler libxml2-dev libxslt1-dev \
              libevent-dev graphviz doxygen time >> /tmp/p12b_apt_install.log 2>&1; then
              echo "PASS_P12B_APT_ATTEMPT=$attempt" >> /tmp/p12b_apt_install.log
              exit 0
            fi
          done
          tail -50 /tmp/p12b_apt_install.log
          exit 1

      - name: Checkout complete Git history
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize bounded P12B physical pilot diagnostics
        id: init
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p episode_output/v05216_preflight
          echo 'P12B: at most 24 PILOT_EXCLUDED physical cases; original P12A 12 CSV unchanged; no formal F3 splits or ML training.' > episode_output/v05216_preflight/START_HERE.txt

      - name: Authenticate P12A GitHub parent success commit artifact digest
        id: parent
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          python3 - <<'PY' > episode_output/v05216_preflight/P12A_PINNED_GITHUB_PARENT.log 2>&1
          import json,os,subprocess,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];assert repo=='parhamarjomand-hub/hcraf-ndnsim'
          token=os.environ['GH_TOKEN'];assert token
          h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
             'User-Agent':'HCRAF-P12B-v05216'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(
                  'https://api.github.com/repos/'+repo+path,headers=h),timeout=60) as r:
                  return json.load(r)
          run=get('/actions/runs/44688603269')
          commit='13cab43cbc1965eb42e78693b3bf4f29e199874e'
          assert run['id']==44688603269 and run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==commit
          assert run['path'].endswith('/hcraf-stage1am-f3-p12-randomized-pressure-prereg-v0.52.15.yml')
          subprocess.check_call(['git','merge-base','--is-ancestor',commit,'HEAD'])
          artifact=get('/actions/artifacts/14607013980')
          assert artifact['name']=='hcraf-f3-p12-time-counterbalanced-pilot-prereg-v05215-run-44688603269'
          assert artifact['digest']=='sha256:6234850df8c2e12b67c61fae87b830aa1fec237a4dfe5c76f53e1a7eb61f8b42'
          assert not artifact['expired'] and artifact.get('workflow_run',{}).get('id')==44688603269
          print('PASS_P12A_PINNED_SUCCESS_COMMIT_ARTIFACT_SHA_GIT_ANCESTRY')
          PY
          cat episode_output/v05216_preflight/P12A_PINNED_GITHUB_PARENT.log

      - name: Retrieve unchanged v0.52.0 original preregistration receipt
        id: receipt
        uses: actions/download-artifact@v4
        with:
          name: hcraf-f3-future-path-queue-pressure-prereg-v0520
          run-id: "43567814962"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: episode_output/v0526_preflight/lock_artifact

      - name: SHA bootstrap every source archive historical parent and new pilot
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > episode_output/v05216_preflight/ALL_PINNED_SOURCES_AND_SHA.log 2>&1
          import hashlib,io,json,os,pathlib,stat,subprocess,zipfile
          name='hcraf_stage1am_f3_p12_pilot_v05216_sources.zip'
          manifest='HCRAF_F3_P12_PILOT_V05216_SOURCE_SHA256.json'
          helper='hcraf/episode/scripts/prepare_stage1am_f3_p12_pilot_v05216.py'
          raw=pathlib.Path(name).read_bytes()
          sha=lambda d:hashlib.sha256(d).hexdigest()
          assert sha(raw)==os.environ['V05216_SOURCE_SHA256'],'CURRENT_ZIP_SHA_CHANGED'
          assert subprocess.check_output(['git','show','HEAD:'+name])==raw,'CURRENT_ZIP_NOT_GIT_COMMITTED'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None,'CURRENT_ZIP_BAD_CRC'
              names=z.namelist()
              assert len(names)==len(set(names)),'DUPLICATE_CURRENT_SOURCE_MEMBER'
              m=json.loads(z.read(manifest))
              assert set(names)==set(m['files'])|{manifest},'CURRENT_SOURCE_MANIFEST_MISMATCH'
              for n,digest in m['files'].items():
                  p=pathlib.PurePosixPath(n)
                  assert n.startswith('hcraf/episode/') and '..' not in p.parts and '\\' not in n
                  assert not stat.S_ISLNK(z.getinfo(n).external_attr>>16)
                  assert sha(z.read(n))==digest,'CURRENT_SOURCE_FILE_SHA:'+n
              assert helper in m['files'],'MISSING_AUTHENTICATED_RESTORE_HELPER'
              source=z.read(helper)
          exec(compile(source,helper,'exec'),{'__name__':'__main__'})
          PY
          tail -35 episode_output/v05216_preflight/ALL_PINNED_SOURCES_AND_SHA.log

      - name: Test pinned P12A matrix P12B physical protocol and leakage gates
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts \
            python3 -m unittest discover -s hcraf/episode/tests \
            -p 'test_stage1am_f3_p12_randomized_pilot_v05215.py' -v \
            > episode_output/v05216_preflight/P12A_AND_P12B_UNIT_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts \
            python3 -m unittest discover -s hcraf/episode/tests \
            -p 'test_stage1am_f3_p12_pilot_v05216.py' -v \
            >> episode_output/v05216_preflight/P12A_AND_P12B_UNIT_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts \
            python3 hcraf/episode/scripts/run_stage1am_f3_p12_pilot_v05216.py --preflight-only \
            > episode_output/v05216_preflight/P12B_24_CASE_ZERO_SIM_PRECHECK.json
          tail -23 episode_output/v05216_preflight/P12A_AND_P12B_UNIT_TESTS.log

      - name: Build isolated v0.52.16 pilot C++ on historically pinned ndnSIM
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bash hcraf/episode/scripts/build_stage1am_f3_p12_pilot_v05216.sh \
            > episode_output/v05216_preflight/CPP_BUILD.log 2>&1
          tail -20 episode_output/v05216_preflight/CPP_BUILD.log

      - name: Execute only P12A frozen PILOT_EXCLUDED physical cases with science gates
        id: simulate
        shell: bash
        run: |
          set -euo pipefail
          python3 hcraf/episode/scripts/run_stage1am_f3_p12_pilot_v05216.py \
            > episode_output/v05216_preflight/P12B_PILOT_PHYSICAL_AND_SCIENCE_GATES.log 2>&1
          tail -35 episode_output/v05216_preflight/P12B_PILOT_PHYSICAL_AND_SCIENCE_GATES.log

      - name: Always save scientific fences and physical failure diagnostics
        if: always()
        id: diagnose
        shell: bash
        env:
          PARENT: ${{ steps.parent.outcome }}
          RESTORE: ${{ steps.restore.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SIMULATE: ${{ steps.simulate.outcome }}
        run: |
          set -u
          mkdir -p episode_output/v05216_preflight
          {
            echo "P12B run=${GITHUB_RUN_ID:-unknown} commit=${GITHUB_SHA:-unknown}"
            echo "parent=$PARENT restore=$RESTORE tests=$TESTS build=$BUILD simulate=$SIMULATE"
            echo 'Maximum 24 permanently PILOT_EXCLUDED physical cases; no Development/Validation/Heldout execution'
            echo 'Scientific NO_GO is recorded in the pilot summary, not silently converted to official GO'
            echo '0 official F3 labels, 0 model fits, 0 official PR-AUC'
            echo 'Congestion=null FutureCongestion=null F3_ready=false GO_FREEZE=false training_ready=false heldout_release_authorized=false'
            echo 'Stage 1AO and NSGA-III forbidden'
          } > episode_output/v05216_preflight/SCIENCE_LOCKS_AND_STEP_OUTCOMES.txt
          find episode_output/v05216_preflight episode_output/stage1am_f3_p12_pilot_v05216 \
            -maxdepth 2 -type f 2>/dev/null | sort \
            > episode_output/v05216_preflight/OUTPUT_INVENTORY.txt || true
          cp /tmp/p12b_apt_update.log episode_output/v05216_preflight/apt_update.log 2>/dev/null || true
          cp /tmp/p12b_apt_install.log episode_output/v05216_preflight/apt_install.log 2>/dev/null || true

      - name: Always upload pilot raw SHA archives and future separate diagnostic tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-f3-p12-counterbalanced-pilot-v05216-run-${{ github.run_id }}
          path: |
            episode_output/v05216_preflight/
            episode_output/stage1am_f3_p12_pilot_v05216/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Save unarchived temporary raw witnesses if an unexpected technical failure occurs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-f3-p12-pilot-v05216-temporary-failure-evidence-${{ github.run_id }}
          path: episode_output/v05216_temporary_raw_seed_work/
          if-no-files-found: ignore
          compression-level: 6
          retention-days: 30
