name: HCRAF - Stage 1S Attribution Robustness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution-robustness:
    name: Build pinned ndnSIM and audit repeated/cache/multihop packet evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pinned-build prerequisites
        run: |
          set -euo pipefail
          mkdir -p episode_output
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential python3 python3-setuptools \
            python-is-python3 pkg-config libboost-all-dev libssl-dev \
            libsqlite3-dev castxml
      - name: Check Stage1S source SHA-256 and safely unpack
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib
          from pathlib import Path, PurePosixPath
          import zipfile
          archive=Path('hcraf_stage1s_sources.zip')
          expected='6e3bc2b338df8b971eb3bf94de4032c243732ae3db95e92b31dfe5e1fedf29aa'
          if hashlib.sha256(archive.read_bytes()).hexdigest()!=expected:
              raise SystemExit('Stage1S source bundle checksum mismatch')
          with zipfile.ZipFile(archive) as source:
              seen=set()
              for obj in source.infolist():
                  name=obj.filename; path=PurePosixPath(name)
                  if (path.is_absolute() or '..' in path.parts or path.parts[:2]!=('hcraf','episode')
                      or len(path.parts)<3 or Path(name).exists() or name in seen):
                      raise SystemExit('Unsafe or duplicate Stage1S source path: '+name)
                  seen.add(name)
              source.extractall('.')
          PYCODE
          cp hcraf_stage1s_sources.zip episode_output/source_bundle.zip
      - name: Run regression and Stage1S Python tests plus C++ wire tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s hcraf/episode/tests -v 2>&1 | tee episode_output/unit_tests.log
          g++ -std=c++11 -Wall -Wextra -pedantic -O2 -I hcraf/episode/src \
            hcraf/episode/tests/wire_decode_driver.cpp -o /tmp/hcraf-stage1s-wire-tests
          /tmp/hcraf-stage1s-wire-tests 2>&1 | tee episode_output/wire_tests.log
      - name: Fetch pinned source and build Stage1S pilot
        run: |
          set -euo pipefail
          bash hcraf/episode/scripts/build_stage1s.sh 2>&1 | tee episode_output/build.log
      - name: Run 12 real Stage1S ndnSIM scenarios and trace audits
        run: |
          set -euo pipefail
          bash hcraf/episode/scripts/run_stage1s.sh 2>&1 | tee episode_output/run.log
      - name: Write manifest even if build or simulation failed
        if: always()
        run: |
          if [ -f hcraf/episode/scripts/manifest_stage1s.py ]; then
            python3 hcraf/episode/scripts/manifest_stage1s.py "$GITHUB_WORKSPACE"
          else
            echo 'Source unpack failed before manifest generator became available' > episode_output/PRE_UNPACK_FAILURE.txt
          fi
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-stage1s-${{ github.run_number }}-${{ github.run_attempt }}
          path: episode_output/
          if-no-files-found: error
          retention-days: 14
