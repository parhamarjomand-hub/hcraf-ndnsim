name: "HCRAF F3 P4 Revised Prospective DEV 48 (v0.52.9 P6)"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  execute-revised-four-independent-development-seeds-forty-eight-cases:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 355
    env:
      V0526_SOURCE_SHA256: "bc18ad86a07036250b3ec488df90e7d1936706b56185fac0a942d4ca6bc08d63"
      V0527_SOURCE_SHA256: "ed810ed57656c1d977a100f34f727a38acc2d8c9ce01fad753bf4c9d4875abdc"
      V0528_SOURCE_SHA256: "02e37199013bc26acf705db17811e7e175f0b13a3353bb8b34e11961dc65ab58"
      V0529_SOURCE_SHA256: "6689c538befd0d74cdc305c5d12bcca6f2e594559d54e44a0c247e9c87f95ece"
    steps:
      - name: Install ns3 ndnSIM dependencies with bounded network retries
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          : > /tmp/p4p6_apt_update.log
          : > /tmp/p4p6_apt_install.log
          # Run 44474934459 fetched 266 MB but failed on transient HTTP
          # connections to archive.ubuntu.com and security.ubuntu.com.
          # Preserve APT's partial download cache across attempts.
          sed -i '/focal-backports/d' /etc/apt/sources.list
          sed -i 's#http://archive.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
          for attempt in 1 2 3; do
            if [ "$attempt" -eq 2 ]; then
              sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
              sed -i 's#http://security.ubuntu.com/ubuntu#https://security.ubuntu.com/ubuntu#g' /etc/apt/sources.list
            elif [ "$attempt" -eq 3 ]; then
              sed -i 's#https://archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
              sed -i 's#https://security.ubuntu.com/ubuntu#http://security.ubuntu.com/ubuntu#g' /etc/apt/sources.list
            fi
            echo "APT_UPDATE_ATTEMPT=$attempt" >> /tmp/p4p6_apt_update.log
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 \
              -o Acquire::https::Timeout=25 update >> /tmp/p4p6_apt_update.log 2>&1 || true
            echo "APT_INSTALL_ATTEMPT=$attempt" >> /tmp/p4p6_apt_install.log
            if apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 \
              -o Acquire::https::Timeout=25 install -y --no-install-recommends \
              git curl ca-certificates build-essential \
              python3 python3-dev python3-setuptools python3-pip python3-pytest \
              pkg-config libboost-all-dev libssl-dev libsqlite3-dev libpcap-dev \
              libgsl-dev libprotobuf-dev protobuf-compiler libxml2-dev libxslt1-dev \
              libevent-dev graphviz doxygen time >> /tmp/p4p6_apt_install.log 2>&1; then
              echo "PASS_APT_DEPENDENCIES_ATTEMPT=$attempt" >> /tmp/p4p6_apt_install.log
              exit 0
            fi
            echo "APT_ATTEMPT_FAILED=$attempt; preserving cached .deb files" >> /tmp/p4p6_apt_install.log
          done
          echo 'FAIL_ALL_THREE_APT_NETWORK_ATTEMPTS; ZERO_SIMULATIONS' >> /tmp/p4p6_apt_install.log
          tail -60 /tmp/p4p6_apt_install.log
          exit 1

      - name: Checkout complete ancestry
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize safe diagnostics and scientific fence
        id: init
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p episode_output/v0529_preflight
          echo 'v0.52.9: 48 REVISED independent DEVELOPMENT runs; previous 23101 pilot excluded; no official F3 labels/PR-AUC/training; Validation/Test forbidden' > episode_output/v0529_preflight/START_HERE.txt

      - name: Verify P4P5 Github parent commit and full immutable artifact digest
        id: parent
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          python3 - <<'PY' > episode_output/v0529_preflight/GITHUB_PARENT_PROVENANCE.log 2>&1
          import json,os,subprocess,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; tok=os.environ['GH_TOKEN']; assert tok
          h={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','User-Agent':'HCRAF-P4P6-v0529'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=60) as r:
                  return json.load(r)
          base=f'https://api.github.com/repos/{repo}/actions/runs/44515403468'
          run=get(base)
          sha='7795890e090e94ccfb587a75e552b0fc98d49442'
          assert run['conclusion']=='success' and run['head_sha']==sha, 'P4P5_PARENT_NOT_THE_VERIFIED_RUN'
          assert run['path'].endswith('/hcraf-stage1am-f3-p4-prospective-dev-v0.52.8.yml'), 'WRONG_P4P5_WORKFLOW'
          subprocess.check_call(['git','merge-base','--is-ancestor',sha,'HEAD'])
          artifact=get(f'https://api.github.com/repos/{repo}/actions/artifacts/14526852611')
          assert artifact['name']=='hcraf-f3-p4-prospective-dev-seed-v0528-run-44515403468'
          assert not artifact['expired'] and artifact['digest']=='sha256:c8b27feeee7056088e7da5748edbad663b7b4f7967204a2cd01ad029365b806b'
          assert artifact.get('workflow_run',{}).get('id')==44515403468
          print('PASS_PINNED_P4P5_PARENT_GITHUB_RUN_AND_ARTIFACT')
          print('Four NEW seeds 23201..23204 in DEVELOPMENT ONLY; previous pilot excluded; Validation/Test barred.')
          PY
          cat episode_output/v0529_preflight/GITHUB_PARENT_PROVENANCE.log

      - name: Retrieve v0.52.0 locked historical plan receipt
        id: receipt
        uses: actions/download-artifact@v4
        with:
          name: hcraf-f3-future-path-queue-pressure-prereg-v0520
          run-id: "43567814962"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: episode_output/v0526_preflight/lock_artifact

      - name: Verify all pinned source ZIP ancestors and restore isolated revised executor
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > episode_output/v0529_preflight/SOURCE_RESTORE_AND_HASH_GATES.log 2>&1
          import hashlib,io,json,os,pathlib,stat,subprocess,zipfile
          old='hcraf_stage1am_f3_p4_physical_mapping_dev_v0526_sources.zip'
          new='hcraf_stage1am_f3_p4_route_diversity_dev_v0527_sources.zip'
          prospective='hcraf_stage1am_f3_p4_prospective_dev_v0528_sources.zip'
          revised='hcraf_stage1am_f3_p4_revised_development_v0529_sources.zip'
          helper='hcraf/episode/scripts/prepare_stage1am_f3_p4_physical_mapping_v0526.py'
          old_m='HCRAF_F3_P4_PHYSICAL_MAPPING_V0526_SOURCE_SHA256.json'
          new_m='HCRAF_F3_P4_ROUTE_DIVERSITY_V0527_SOURCE_SHA256.json'
          prospective_m='HCRAF_F3_P4_PROSPECTIVE_DEV_V0528_SOURCE_SHA256.json'
          revised_m='HCRAF_F3_P4_REVISED_DEV_V0529_SOURCE_SHA256.json'
          def checked_committed(name,expected):
              raw=pathlib.Path(name).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==expected, 'ROOT_ZIP_SHA_CHANGED:'+name
              assert subprocess.check_output(['git','show','HEAD:'+name])==raw, 'SOURCE_ZIP_NOT_COMMITTED:'+name
              return raw
          def checked_archive(raw,manifest):
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  assert z.testzip() is None, 'BAD_ZIP_CRC'
                  names=z.namelist()
                  assert len(names)==len(set(names)), 'DUPLICATE_ARCHIVE_ENTRY'
                  for name in names:
                      path=pathlib.PurePosixPath(name)
                      assert name and not name.startswith('/') and '..' not in path.parts and '\\' not in name
                      assert not stat.S_ISLNK(z.getinfo(name).external_attr>>16)
                  info=json.loads(z.read(manifest))
                  assert set(names)==set(info['files'])|{manifest}, 'ZIP_MANIFEST_MEMBER_MISMATCH'
                  for name,digest in info['files'].items():
                      assert hashlib.sha256(z.read(name)).hexdigest()==digest, 'FILE_SHA_CHANGED:'+name
                  files={n:z.read(n) for n in info['files']}
              return info,files
          old_raw=checked_committed(old,os.environ['V0526_SOURCE_SHA256'])
          old_info,old_files=checked_archive(old_raw,old_m)
          assert helper in old_files
          exec(compile(old_files[helper],helper,'exec'),{'__name__':'__main__'})
          new_raw=checked_committed(new,os.environ['V0527_SOURCE_SHA256'])
          m,files=checked_archive(new_raw,new_m)
          assert m['stage']=='v0.52.7_P4_P4_DEV_ROUTE_DIVERSITY_HISTORICAL_FIXTURES_ONLY'
          assert m['parent_p4_p3_run_id']=='44458755203'
          assert m['simulations_planned']==8 and m['independent_P4_seeds_consumed']==0
          assert m['original_v0520_prereg_unchanged'] and m['original_v0524_prereg_unchanged']
          for k,v in {'Congestion':None,'FutureCongestion':None,'F3_ready':False,'GO_FREEZE':False,
                      'training_ready':False,'heldout_release_authorized':False}.items():
              assert m[k] is v, 'NEW_MANIFEST_SCIENCE_LOCK_BROKEN:'+k
          assert all(not pathlib.Path(n).exists() for n in files), 'REFUSE_OVERWRITE_V0527_EXISTING_SOURCE'
          for n,data in files.items():
              path=pathlib.Path(n)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          pro_raw=checked_committed(prospective,os.environ['V0528_SOURCE_SHA256'])
          p,prospective_files=checked_archive(pro_raw,prospective_m)
          assert p['stage']=='v0.52.8_P4_P5_PROSPECTIVE_ONE_DEVELOPMENT_SEED_ONLY'
          assert p['parent_p4_p4_run_id']=='44506597468'
          assert p['parent_p4_p4_head_sha']=='d552c88898fcd81421d106cafcf9a427de7d5010'
          assert p['parent_p4_p4_artifact_id']=='14522643049'
          assert p['parent_p4_p4_artifact_sha256']=='879f1ae307f21f62c53830cfbef33f434e92de258d28075ae8b5166255e222a5'
          assert p['upstream_v0524_design_unchanged'] and p['upstream_v0520_design_unchanged']
          assert p['prospective_seed_23101_development_only'] and p['simulations_planned']==12
          assert not p['prospective_remaining_development_seeds_authorized']
          assert not p['prospective_validation_seeds_authorized']
          assert not p['prospective_heldout_seeds_authorized']
          assert p['official_F3_labels_constructed']==0 and p['F3_PR_AUC_computed'] is False
          for k,v in {'Congestion':None,'FutureCongestion':None,'F3_ready':False,
                      'GO_FREEZE':False,'training_ready':False,
                      'heldout_release_authorized':False}.items():
              assert p[k] is v, 'PROSPECTIVE_MANIFEST_SCIENCE_LOCK_BROKEN:'+k
          assert all(not pathlib.Path(n).exists() for n in prospective_files), 'REFUSE_OVERWRITE_V0528_SOURCE'
          for n,data in prospective_files.items():
              path=pathlib.Path(n)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          new_raw=checked_committed(revised,os.environ['V0529_SOURCE_SHA256'])
          r,revised_files=checked_archive(new_raw,revised_m)
          assert r['stage']=='v0.52.9_P4_P6_REVISED_PROSPECTIVE_NEW_FOUR_DEV_SEEDS'
          assert r['parent_p4_p5_run_id']=='44515403468'
          assert r['parent_p4_p5_head_sha']=='7795890e090e94ccfb587a75e552b0fc98d49442'
          assert r['parent_p4_p5_artifact_id']=='14526852611'
          assert r['parent_p4_p5_artifact_sha256']=='c8b27feeee7056088e7da5748edbad663b7b4f7967204a2cd01ad029365b806b'
          assert r['original_v0520_protocol_unchanged'] and r['original_v0524_protocol_unchanged']
          assert r['v0528_consumed_seed_23101_excluded']
          assert r['new_development_seeds']==[23201,23202,23203,23204]
          assert r['validation_seeds_unchanged_not_authorized']==[24101,24102,24103,24104]
          assert r['heldout_seeds_unchanged_not_authorized']==[25101,25102,25103,25104]
          assert r['split_matrix_revised_total']==144
          assert r['authorized_development_simulations']==48
          assert r['validation_simulations_authorized']==r['heldout_simulations_authorized']==0
          assert r['official_F3_labels_constructed']==0 and r['F3_PR_AUC_computed'] is False
          assert r['candidate_diagnostic_tables_allowed'] is True
          for k,v in {'Congestion':None,'FutureCongestion':None,'F3_ready':False,
                      'GO_FREEZE':False,'training_ready':False,
                      'heldout_release_authorized':False}.items():
              assert r[k] is v, 'REVISED_PROSPECTIVE_MANIFEST_SCIENCE_LOCK_BROKEN:'+k
          assert all(not pathlib.Path(n).exists() for n in revised_files), 'REFUSE_OVERWRITE_V0529_SOURCE'
          for n,data in revised_files.items():
              path=pathlib.Path(n)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          print('PASS_V0526_V0527_V0528_V0529_FULL_PARENT_GIT_PREIMAGES_AND_PER_FILE_SHA')
          PY
          cat episode_output/v0529_preflight/SOURCE_RESTORE_AND_HASH_GATES.log

      - name: Run all ancestry and v0.52.9 new split, schedule, anti-leakage tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts python3 -m unittest discover \
            -s hcraf/episode/tests -p 'test_stage1am_f3_queue_telemetry_smoke_v0522.py' -v \
            > episode_output/v0529_preflight/UNIT_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts python3 -m unittest discover \
            -s hcraf/episode/tests -p 'test_stage1am_f3_queue_pressure_feasibility_v0523.py' -v \
            >> episode_output/v0529_preflight/UNIT_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts python3 -m unittest discover \
            -s hcraf/episode/tests -p 'test_stage1am_f3_p4_physical_mapping_v0526.py' -v \
            >> episode_output/v0529_preflight/UNIT_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts python3 -m unittest discover \
            -s hcraf/episode/tests -p 'test_stage1am_f3_p4_route_diversity_dev_v0527.py' -v \
            >> episode_output/v0529_preflight/UNIT_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts python3 -m unittest discover \
            -s hcraf/episode/tests -p 'test_stage1am_f3_p4_prospective_dev_v0528.py' -v \
            >> episode_output/v0529_preflight/UNIT_TESTS.log 2>&1
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=hcraf/episode/scripts python3 -m unittest discover \
            -s hcraf/episode/tests -p 'test_stage1am_f3_p4_revised_dev_v0529.py' -v \
            >> episode_output/v0529_preflight/UNIT_TESTS.log 2>&1
          python3 hcraf/episode/scripts/run_stage1am_f3_p4_revised_dev_v0529.py \
            --preflight-only > episode_output/v0529_preflight/FORTY_EIGHT_REVISED_DEV_PLAN.json

      - name: Build isolated revised prospective v0.52.9 C++ with pinned instrumentation
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bash hcraf/episode/scripts/build_stage1am_f3_p4_revised_dev_v0529.sh \
            > episode_output/v0529_preflight/CPP_BUILD.log 2>&1
          tail -12 episode_output/v0529_preflight/CPP_BUILD.log

      - name: Run forty eight revised prospective development conditions only
        id: simulate
        shell: bash
        run: |
          set -euo pipefail
          python3 hcraf/episode/scripts/run_stage1am_f3_p4_revised_dev_v0529.py \
            > episode_output/v0529_preflight/FORTY_EIGHT_REVISED_SIMULATIONS_AND_AUDITS.log 2>&1
          tail -55 episode_output/v0529_preflight/FORTY_EIGHT_REVISED_SIMULATIONS_AND_AUDITS.log

      - name: Construct separate leakage-gated DEVELOPMENT candidate tables
        id: tables
        shell: bash
        run: |
          set -euo pipefail
          python3 hcraf/episode/scripts/build_stage1am_f3_p4_revised_dev_tables_v0529.py \
            > episode_output/v0529_preflight/FEATURE_AND_DIAGNOSTIC_TABLES.log 2>&1
          tail -12 episode_output/v0529_preflight/FEATURE_AND_DIAGNOSTIC_TABLES.log

      - name: Always save science lock status and failure diagnostics
        if: always()
        id: diagnose
        shell: bash
        env:
          PARENT: ${{ steps.parent.outcome }}
          RESTORE: ${{ steps.restore.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SIMULATE: ${{ steps.simulate.outcome }}
          TABLES: ${{ steps.tables.outcome }}
        run: |
          set -u
          mkdir -p episode_output/v0529_preflight
          {
            echo 'v0.52.9 P4/P6 REVISED INDEPENDENT FOUR-SEED DEVELOPMENT ONLY; 48 conditions; seed 23101 excluded'
            echo "run_id=${GITHUB_RUN_ID:-unknown} head_sha=${GITHUB_SHA:-unknown}"
            echo "parent=$PARENT restore=$RESTORE tests=$TESTS build=$BUILD simulate=$SIMULATE tables=$TABLES"
            echo 'Congestion=null FutureCongestion=null F3_ready=false GO_FREEZE=false training_ready=false heldout_release_authorized=false'
            echo 'Validation/Test 0; 0 official F3 labels; only separate retrospective diagnostic events; 0 models/PR-AUC; no Stage1AO/NSGA-III'
          } > episode_output/v0529_preflight/SCIENCE_LOCKS_AND_STEP_OUTCOMES.txt
          find episode_output -maxdepth 9 -type f | sort > episode_output/v0529_preflight/OUTPUT_INVENTORY.txt
          cp /tmp/p4p6_apt_update.log episode_output/v0529_preflight/apt_update.log 2>/dev/null || true
          cp /tmp/p4p6_apt_install.log episode_output/v0529_preflight/apt_install.log 2>/dev/null || true

      - name: Always upload revised development raw witnesses candidate tables and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcraf-f3-p4-revised-prospective-dev-v0529-run-${{ github.run_id }}
          path: |
            episode_output/v0529_preflight/
            episode_output/stage1am_f3_p4_revised_dev_v0529/
          if-no-files-found: error
          retention-days: 30
