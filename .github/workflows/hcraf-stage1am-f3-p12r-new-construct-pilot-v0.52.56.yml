name: HCRAF F3 P12R New Construct Native Pilot 45 Cases (v0.52.56)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hcraf-f3-p12r-new-construct-pilot-v05256
  cancel-in-progress: false
jobs:
  native_pilot:
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 360
    env:
      P12R56_SOURCE_SHA256: "cdc7b66fb50671f7c310d554c2326fa2d950ca04dce16e1d878fe6013a68f2b7"
      P12R56_PREREG_SHA256: "746889957c3d91523fa937e7a888cef4e50d847c8596760f6b833ccdafe28ab2"
      P12R56_PREREG: p12r56_auth/prereg.zip
      P12R_DEV_SOURCE_SHA256: "d90d0766984ee1d9d2599b69655605c0cf08d16d3369d08ca7c729c58e8bed10"
      P12T_SOURCE_SHA256: "08b76621c5cb371fe04955d42b27f1a682f883f058ec06f050c60c42724fafa1"
      P12U_SOURCE_SHA256: "469afe7567e375db8d07d16802ddde6dbf68bfd1aadd15c4f7d6ddd3761b401d"
      P12V_SOURCE_SHA256: "871bcf33b5d3ed4745ccffc0b2529900b3e0987fffdde170656544d29174cf64"
      P12S_SOURCE_SHA256: "587d792d7e7e7f1837da8df0490b6fba5a0394248917ae2f0b570bb925b594e0"
      P12R_SOURCE_SHA256: "dbb12863ca83c26b687b243211aaf698986b8d6f2f7b8656cffb06278751ae30"
      V05231_SOURCE_SHA256: "f45e1e1b9dfa276568e9c3b6989dfec6496e8fc7e3d86e1b30d53963b549a265"
      V05225_SOURCE_SHA256: "13ff992e6be059e0ba8f92bb1cf97f76d5c3ed78fe259cfe43b78f47c01ce287"
      V0526_SOURCE_SHA256: "bc18ad86a07036250b3ec488df90e7d1936706b56185fac0a942d4ca6bc08d63"
      V05216_SOURCE_SHA256: "33b4c9d18d1f0f3cef581ce4e2b8e983295eb678d67a3939a8b4faa786fcc0b5"
      V05218_SOURCE_SHA256: "e4cf3e0b0784763746c3a690a9f716f70ecb27a5a88d9ac2a31fb798fa3992fb"
      V05219_SOURCE_SHA256: "72e46581c8124e83372fb84f5bf014637d44d1c61f990cb8d0582f04de14b96f"
      V05220_SOURCE_SHA256: "000f5d89c0490c46afdc5e4d741dcf85935e193f013dd37a4ed33299b7403082"
      V05221_SOURCE_SHA256: "21f0ac48cb825a97b8deb8bc8b2377483a1140fe9ffa2e0aaa32872e26451df2"
      V05222_SOURCE_SHA256: "351a57feec078bcadf9ba207087bb9774bee0c829aac38bacc5801ae810daddf"
    steps:
      - name: Require first dispatch and no automatic repeat
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_RUN_NUMBER" = 1
      - name: Install historical pinned-build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sed -i '/focal-backports/d' /etc/apt/sources.list
          sed -i 's#http://archive.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list
          for attempt in 1 2 3; do
            if [ "$attempt" -eq 2 ]; then
              sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g; s#http://security.ubuntu.com/ubuntu#https://security.ubuntu.com/ubuntu#g' /etc/apt/sources.list
            elif [ "$attempt" -eq 3 ]; then
              sed -i 's#https://archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g; s#https://security.ubuntu.com/ubuntu#http://security.ubuntu.com/ubuntu#g' /etc/apt/sources.list
            fi
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update || true
            if apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends git curl ca-certificates build-essential python3 python3-dev python3-setuptools python3-pip python3-pytest pkg-config libboost-all-dev libssl-dev libsqlite3-dev libpcap-dev libgsl-dev libprotobuf-dev protobuf-compiler libxml2-dev libxslt1-dev libevent-dev graphviz doxygen time; then exit 0; fi
          done
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate official preregistration and committed source packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --is-shallow-repository)" = false
          mkdir -p episode_output/p12r56_preflight p12r56_auth
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,stat,subprocess,urllib.request,zipfile
          def need(c,m):
              if not c: raise RuntimeError(m)
          repo=os.environ['GITHUB_REPOSITORY'];need(repo=='parhamarjomand-hub/hcraf-ndnsim','REPO')
          def get(path):
              q=urllib.request.Request('https://api.github.com/repos/'+repo+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'HCRAF-P12R56'})
              with urllib.request.urlopen(q,timeout=60) as r:return json.load(r)
          rid=46044334756;aid=15221940873;commit='cd3c1c87351497e3be1093bf81c156bbc273c08f'
          r=get('/actions/runs/'+str(rid));a=get('/actions/artifacts/'+str(aid))
          need(r['status']=='completed' and r['conclusion']=='success' and r['head_sha']==commit and r['path']=='.github/workflows/hcraf-stage1am-f3-p12r-new-construct-prereg-v0.52.54.yml' and r['run_attempt']==1,'PREREG_RUN')
          subprocess.check_call(['git','merge-base','--is-ancestor',commit,'HEAD'])
          need(not a['expired'] and a['workflow_run']['id']==rid and a['workflow_run']['head_sha']==commit and a['digest']=='sha256:'+os.environ['P12R56_PREREG_SHA256'] and a['size_in_bytes']==180335,'PREREG_ARTIFACT')
          pathlib.Path('episode_output/p12r56_preflight/parent.json').write_text(json.dumps(dict(run_id=rid,head_sha=commit,artifact_id=aid,digest=a['digest']),sort_keys=True,indent=2)+'\n')
          archives=[('hcraf_stage1am_f3_p12r_dev_collection_v05246_sources.zip','P12R_DEV_SOURCE_SHA256','HCRAF_F3_P12R_DEV_SOURCE_SHA256_v05246.json',False),('hcraf_stage1am_f3_p12r_new_construct_pilot_v05256_sources.zip','P12R56_SOURCE_SHA256','HCRAF_F3_P12R_NEW_CONSTRUCT_PILOT_SOURCE_SHA256_v05256.json',True)]
          for name,env,mn,pilot in archives:
              raw=pathlib.Path(name).read_bytes()
              need(hashlib.sha256(raw).hexdigest()==os.environ[env] and subprocess.check_output(['git','show','HEAD:'+name])==raw,'ARCHIVE_SHA:'+name)
              with zipfile.ZipFile(name) as z:
                  m=json.loads(z.read(mn));need(z.testzip() is None and len(z.namelist())==len(set(z.namelist())) and set(z.namelist())==set(m['files'])|{mn},'MANIFEST:'+name)
                  need(all(m[k] is False for k in ('F3_ready','GO_FREEZE','training_ready')),'LOCK:'+name)
                  if pilot:need(m['pilot_cases_authorized']==45 and m['development_cases_authorized']==m['confirmation_cases_authorized']==m['model_fits_authorized']==0 and m['prereg_sha256']==os.environ['P12R56_PREREG_SHA256'] and m['Congestion'] is None and m['FutureCongestion'] is None and not m['heldout_release_authorized'] and not m['Stage1AO_or_NSGAIII_authorized'],'PILOT_LOCK')
                  else:need(m['confirmation_cases_authorized']==0 and m['diagnostic_rows_authorized']==0,'HISTORICAL_BUILD_ONLY')
                  for n,h in m['files'].items():
                      p=pathlib.PurePosixPath(n);need(p.parts[:2]==('hcraf','episode') and '..' not in p.parts and not p.is_absolute() and chr(92) not in n and not stat.S_ISLNK(z.getinfo(n).external_attr>>16),'PATH')
                      b=z.read(n);d=pathlib.Path(n);need(hashlib.sha256(b).hexdigest()==h and not d.exists(),'MEMBER:'+n);d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
              print('PASS_AUTHENTIC_SOURCE',name)
          PYCODE
          curl --fail --silent --show-error --location --retry 3 --max-time 180 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/parhamarjomand-hub/hcraf-ndnsim/actions/artifacts/15221940873/zip' -o "$P12R56_PREREG"
          echo "$P12R56_PREREG_SHA256  $P12R56_PREREG" | sha256sum -c -
      - name: Audit prior declared seed namespace before any simulation
        shell: bash
        run: |
          set -euo pipefail
          python3 hcraf/episode/scripts/p12r56/history_guard.py episode_output/p12r56_preflight/historical_namespace.json
      - name: Test prospective schedule and independent queue and wire audit guards
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s hcraf/episode/scripts/p12r56 -p 'test_pilot.py' -v 2>&1 | tee episode_output/p12r56_preflight/tests.log
      - name: Verify previous compile-only failure before authorizing technical retry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json,os,urllib.request,subprocess,pathlib,hashlib
          repo=os.environ['GITHUB_REPOSITORY']; assert repo=='parhamarjomand-hub/hcraf-ndnsim'
          def get(path):
              q=urllib.request.Request('https://api.github.com/repos/'+repo+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'HCRAF-P12R56'})
              with urllib.request.urlopen(q,timeout=60) as r:return json.load(r)
          rid=46045524607; aid=15223339392; commit='32bf88f3b77efaea170b7ed2c512e1c05a711561'
          r=get('/actions/runs/'+str(rid)); assert r['status']=='completed' and r['conclusion']=='failure' and r['head_sha']==commit and r['run_attempt']==1 and r['path']=='.github/workflows/hcraf-stage1am-f3-p12r-new-construct-pilot-v0.52.55.yml'
          subprocess.check_call(['git','merge-base','--is-ancestor',commit,'HEAD'])
          jobs=get('/actions/runs/'+str(rid)+'/jobs')['jobs']; assert len(jobs)==1 and jobs[0]['id']==140663703649 and jobs[0]['conclusion']=='failure'
          steps={s['number']:s for s in jobs[0]['steps']}; assert steps[13]['name'].startswith('Compile pinned ndnSIM') and steps[13]['conclusion']=='failure' and steps[14]['name'].startswith('Execute and independently audit exactly 45') and steps[14]['conclusion']=='skipped' and steps[15]['conclusion']=='skipped'
          a=get('/actions/artifacts/'+str(aid)); assert a['workflow_run']['id']==rid and a['workflow_run']['head_sha']==commit and a['digest']=='sha256:dfc05a5ddbc87ac3ad514ec1115fc99a014c1ac904f814fc2fc29957a9f11d63' and a['size_in_bytes']==50083 and not a['expired']
          old=subprocess.check_output(['git','show',commit+':hcraf_stage1am_f3_p12r_new_construct_pilot_v05255_sources.zip']); assert hashlib.sha256(old).hexdigest()=='f543b6356fce3b419ba34e44e45642f0409da629cdabeb4b4baaeb4cb0d1bd93'
          pathlib.Path('episode_output/p12r56_preflight/technical_retry.json').write_text(json.dumps(dict(run_id=rid,artifact_id=aid,commit=commit,artifact_digest=a['digest'],compile_failed=True,simulation_step_skipped=True),indent=2,sort_keys=True)+'\n')
          PYCODE
          curl --fail --silent --show-error --location --retry 3 --max-time 120 -H "Authorization: Bearer $GH_TOKEN" 'https://api.github.com/repos/parhamarjomand-hub/hcraf-ndnsim/actions/artifacts/15223339392/zip' -o p12r56_auth/failed_parent.zip
          echo 'dfc05a5ddbc87ac3ad514ec1115fc99a014c1ac904f814fc2fc29957a9f11d63  p12r56_auth/failed_parent.zip' | sha256sum -c -
          python3 - <<'PYCODE'
          import zipfile
          with zipfile.ZipFile('p12r56_auth/failed_parent.zip') as z:
              assert z.testzip() is None and set(z.namelist())=={'p12r55_preflight/parent.json','p12r55_preflight/build.log','p12r55_preflight/restore.log','p12r55_preflight/historical_namespace.json','p12r55_preflight/science_fences.log','p12r55_preflight/tests.log','p12v_native_preflight/NFD_PINNED_HOOK_PATCH_RECEIPT.json'}
              assert 'reference to ‘Probe’ is ambiguous' in z.read('p12r55_preflight/build.log').decode()
          print('PASS_PREVIOUS_COMPILE_ONLY_FAILURE_NO_SIMULATION')
          PYCODE
      - name: Compile actual schedule excerpt with deliberately colliding ns3 Probe type
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 hcraf/episode/scripts/p12r56/compile_regression.py 2>&1 | tee episode_output/p12r56_preflight/compile_regression.log
      - name: Restore immutable original science-lock receipt
        uses: actions/download-artifact@v4
        with:
          name: hcraf-f3-future-path-queue-pressure-prereg-v0520
          run-id: "43567814962"
          github-token: ${{ github.token }}
          path: episode_output/v0526_preflight/lock_artifact
      - name: Restore original P12K prereg receipt
        uses: actions/download-artifact@v4
        with:
          name: hcraf-f3-p12k-prereg-v05225-run-45195251299
          run-id: "45195251299"
          github-token: ${{ github.token }}
          path: p12v_auth_p12k_receipt
      - name: Retrieve only the P12Z causal QC receipt artifact, not diagnostic rows
        uses: actions/download-artifact@v4
        with:
          name: hcraf-f3-p12z-independent-native-nack-drop-causal-witness-v05245-run-45950796539
          run-id: "45950796539"
          github-token: ${{ github.token }}
          path: p12r_auth_p12z
      - name: Authenticate and restore immutable build inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 hcraf/episode/scripts/restore_stage1am_f3_p12r_dev_v05246.py 2>&1 | tee episode_output/p12r56_preflight/restore.log
      - name: Compile pinned ndnSIM and native pilot executor without historical simulations
        shell: bash
        run: |
          set -euo pipefail
          bash hcraf/episode/scripts/build_stage1am_f3_p12r_new_construct_pilot_v05256.sh > episode_output/p12r56_preflight/build.log 2>&1 || { tail -100 episode_output/p12r56_preflight/build.log; exit 1; }
          tail -30 episode_output/p12r56_preflight/build.log
      - name: Execute and independently audit exactly 45 pilot scenarios (no fitting)
        shell: bash
        run: |
          set -euo pipefail
          python3 hcraf/episode/scripts/p12r56/pilot_audit.py --prereg "$P12R56_PREREG" --ns3 episode_sources/ns-3 --out episode_output/p12r56_pilot 2>&1 | tee episode_output/p12r56_preflight/pilot.log
      - name: Verify all case receipts and physical outputs, keep scientific locks closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,json,pathlib
          p=pathlib.Path('episode_output/p12r56_pilot');r=json.loads((p/'PILOT_RECEIPT.json').read_text())
          def need(c,m):
              if not c:raise RuntimeError(m)
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          need(r['status']=='PASS_P12R_NEW_CONSTRUCT_PILOT_ENGINEERING_ONLY_NO_F3_RELEASE' and r['prior_status']=='NO_GO_P12R_CONFIRMATORY_STATISTICAL_GATES_NOT_MET','STATUS')
          need(r['cases']==45 and r['decisions']==5670 and r['all_candidate_feature_rows']==17010 and len(r['case_receipt_hashes'])==45,'COUNTS')
          need(all(r[k] is False for k in ('F3_ready','GO_FREEZE','training_ready','heldout_release_authorized','Stage1AO_or_NSGAIII_authorized','construct_validated','new_AP_computed','new_bootstrap_computed','pilot_rows_trainable')) and r['Congestion'] is None and r['FutureCongestion'] is None,'FENCES')
          need(all(r[k]==0 for k in ('model_fits','confirmation_cases','development_cases','heldout_rows_read','official_F3_labels_constructed')),'NO_TRAINING_OR_RELEASE')
          need(set(r['case_receipt_hashes'])=={str(x.relative_to(p)) for x in p.rglob('case_receipt.json')},'CASE_SET')
          for name,h in r['case_receipt_hashes'].items():
              f=p/name;need(sha(f)==h,'CASE_RECEIPT_HASH');rc=json.loads(f.read_text());need(rc['status']=='PASS_PILOT_CASE_ENGINEERING_ONLY' and rc['decisions']==126 and rc['case']['partition']=='pilot','CASE_QC')
              need(set(rc['files'])=={x.name for x in f.parent.iterdir() if x.is_file() and x.name!='case_receipt.json'},'RAW_SET')
              for n,v in rc['files'].items():need(pathlib.Path(n).name==n and sha(f.parent/n)==v,'RAW_HASH:'+n)
          print('PASS_ALL_45_PILOT_CASE_SEALS_NO_F3_RELEASE')
          PYCODE
      - name: Always publish scientific fences and provenance
        if: always()
        shell: bash
        run: |
          mkdir -p episode_output/p12r56_preflight
          printf '%s\n' "RUN=$GITHUB_RUN_ID SHA=$GITHUB_SHA VERSION=v0.52.56" 'F3_ready=false GO_FREEZE=false training_ready=false Congestion=null FutureCongestion=null' 'Engineering pilot only. No DEV, confirmation, heldout, model fit, AP, bootstrap or official labels. Technical retry of prior compile-only failure; identical preregistered schedule and design. Do not reuse pilot seeds after any executed design change.' > episode_output/p12r56_preflight/science_fences.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hcraf-f3-p12r-new-construct-pilot-v05256-run-${{ github.run_id }}
          path: |
            episode_output/p12r56_preflight/
            episode_output/p12v_native_preflight/
            episode_output/p12r56_pilot/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hcraf-f3-p12r-new-construct-pilot-failure-v05256-run-${{ github.run_id }}
          path: |
            episode_output/p12r56_preflight/
            episode_output/p12v_native_preflight/
            episode_output/p12r56_pilot/
          if-no-files-found: warn
          retention-days: 90
